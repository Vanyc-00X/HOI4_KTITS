 mk_zld.1.t:0 "Новая коалиция"
 mk_zld.1.d:0 "Сабирова Альфия Расилевна представляет кабинет. Министров больше, чем партий, партий — больше, чем идей."
 mk_zld.1.a:0 "Ставка на «Коалиционный капитал»"
 mk_zld.1.b:0 "Созвать парламент"
 mk_zld.2.t:0 "Коалиция держится"
 mk_zld.2.d:0 "Сабирова подписывает новое коалиционное соглашение. Оно длиннее конституции."
 mk_zld.2.a:0 "Вперёд, без оглядки"
 mk_zld.2.b:0 "Международные наблюдатели"
 mk_zld.3.t:0 "Левый поворот"
 mk_zld.3.d:0 "Сабирова объявляет национализацию ключевых отраслей. Партнёры по коалиции аплодируют стоя."
 mk_zld.3.a:0 "Вперёд, без оглядки"
 mk_zld.3.b:0 "Экспорт лозунгов соседям"
 mk_zld.4.t:0 "Партии отстранены"
 mk_zld.4.d:0 "Сабирова распускает коалицию и назначает министров-экспертов."
 mk_zld.4.a:0 "Вперёд, без оглядки"
 mk_zld.4.b:0 "Тихая стабилизация"
 mk_zld.5.t:0 "Конец компромиссов"
 mk_zld.5.d:0 "Сабирова объявляет: «Коалиции кончились»."
 mk_zld.5.a:0 "Вперёд, без оглядки"
 mk_zld.5.b:0 "Вплести код НПТ в курс"
 mk_zld.6.t:0 "Коалиция для мира"
 mk_zld.6.d:0 "Сабирова предлагает соседям общую коалицию. Некоторые уже согласны."
 mk_zld.6.a:0 "Открыть тайну миру"
 mk_zld.6.b:0 "Засекретить всё"
 mk_zld.7.t:0 "Пакет реформ"
 mk_zld.7.d:0 "Коалиция приняла пакет социальных реформ за одно заседание."
 mk_zld.7.a:0 "Выжать максимум"
 mk_zld.7.b:0 "Распределить выгоды"
 mk_zld.7.c:0 "Купить голос на Конгрессе"
 mk_zld.8.t:0 "Коалиция трещит"
 mk_zld.8.d:0 "Младший партнёр угрожает выйти из правительства."
 mk_zld.8.a:0 "Чрезвычайные меры"
 mk_zld.8.b:0 "Купить лояльность"
 mk_zld.8.c:0 "Свалить вину на соседей"
 mk_zld.9.t:0 "Великая коалиция"
 mk_zld.9.d:0 "В коалиции все. Оппозиции не осталось — даже ради приличия."
 mk_zld.9.a:0 "Использовать подъём"
 mk_zld.9.b:0 "Сбросить напряжение"
 mk_zld.9.c:0 "Объявить исторический момент"
 mk_zld.10.t:0 "Экономика благосостояния"
 mk_zld.10.d:0 "Зеленодольск признан самой справедливой экономикой Казуалии."
 mk_zld.10.a:0 "Новые заводы"
 mk_zld.10.b:0 "Инженерные бюро"
 mk_zld.10.c:0 "Военный заказ"
 mk_zld.11.t:0 "Армия граждан"
 mk_zld.11.d:0 "Каждый гражданин знает, где его винтовка и его избирательный участок."
 mk_zld.11.a:0 "Подготовить повод к войне"
 mk_zld.11.b:0 "Только оборона"
 mk_zld.11.c:0 "Показательные манёвры"
 mk_zld.12.t:0 "Мастер переговоров"
 mk_zld.12.d:0 "Делегация Зеленодольска заключила три договора за один обед."
 mk_zld.12.a:0 "Голос на Конгрессе"
 mk_zld.12.b:0 "Друзья по всей Казуалии"
 mk_zld.12.c:0 "Сколотить идеологический блок"
 mk_zld.13.t:0 "Вечная коалиция"
 mk_zld.13.d:0 "Демократический Зеленодольск предложил всей Казуалии единое коалиционное правительство."
 mk_zld.13.a:0 "Компромисс победил"
 mk_zld.14.t:0 "Новый союзник"
 mk_zld.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_zld.14.a:0 "Укрепить договор"
 mk_zld.14.b:0 "Сразу требовать большего"
 mk_zld.15.t:0 "Слух из кабинетов"
 mk_zld.15.d:0 "В коридорах Демократический Зеленодольск шепчутся о новом курсе. Народ ждёт сигнала."
 mk_zld.15.a:0 "Разогнать слух"
 mk_zld.15.b:0 "Официально опровергнуть"
 mk_zld.15.c:0 "Подлить масла"
 mk_zld.16.t:0 "Повод на столе генштаба"
 mk_zld.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_zld.16.a:0 "Жёсткий ультиматум"
 mk_zld.16.b:0 "Тихая подготовка"
 mk_zld.16.c:0 "Отложить"
 mk_zld.17.t:0 "Тихий торг эпохи"
 mk_zld.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_zld.17.a:0 "Принять сделку"
 mk_zld.17.b:0 "Торговаться жёстче"
 mk_zld.17.c:0 "Отказаться"
 mk_zld.18.t:0 "Утечка из секретного архива"
 mk_zld.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_zld.18.a:0 "Засекретить обратно"
 mk_zld.18.b:0 "Опубликовать выборочно"
 mk_zld.18.c:0 "Обвинить соседей"
 mk_zld.19.t:0 "Идеологический саммит"
 mk_zld.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_zld.19.a:0 "Сколотить альянс сейчас"
 mk_zld.19.b:0 "Сначала мнения"
 mk_zld.19.c:0 "Только протокол"
