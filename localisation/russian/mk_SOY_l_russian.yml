 mk_soy.1.t:0 "Релиз Республики"
 mk_soy.1.d:0 "Ефимов Александр Андреевич выкатывает новую версию государства. Патч-ноты занимают 300 страниц."
 mk_soy.1.a:0 "Ставка на «Программистские проекты»"
 mk_soy.1.b:0 "Созвать парламент"
 mk_soy.2.t:0 "Курс сохранён"
 mk_soy.2.d:0 "Ефимов публикует манифест: «Свобода — лучший фреймворк»."
 mk_soy.2.a:0 "Вперёд, без оглядки"
 mk_soy.2.b:0 "Международные наблюдатели"
 mk_soy.3.t:0 "Код национализирован"
 mk_soy.3.d:0 "Все частные репозитории Республики стали общественными. Программисты в шоке, но коммитят."
 mk_soy.3.a:0 "Вперёд, без оглядки"
 mk_soy.3.b:0 "Экспорт лозунгов соседям"
 mk_soy.4.t:0 "Совет директоров у власти"
 mk_soy.4.d:0 "Республика реорганизована в холдинг. Граждане получили табели учёта."
 mk_soy.4.a:0 "Вперёд, без оглядки"
 mk_soy.4.b:0 "Вплести код НПТ в курс"
 mk_soy.5.t:0 "Алгоритм у власти"
 mk_soy.5.d:0 "Ефимов передаёт часть полномочий «Модели Республики». Модель вежливо благодарит."
 mk_soy.5.a:0 "Вперёд, без оглядки"
 mk_soy.5.b:0 "Тихая стабилизация"
 mk_soy.6.t:0 "Репозиторий открыт"
 mk_soy.6.d:0 "Ефимов публикует конституцию под свободной лицензией. Форк разрешён."
 mk_soy.6.a:0 "Открыть тайну миру"
 mk_soy.6.b:0 "Засекретить всё"
 mk_soy.7.t:0 "IPO Республики"
 mk_soy.7.d:0 "Громкие проекты выходят на рынок, деньги текут в казну."
 mk_soy.7.a:0 "Выжать максимум"
 mk_soy.7.b:0 "Распределить выгоды"
 mk_soy.7.c:0 "Купить голос на Конгрессе"
 mk_soy.8.t:0 "Технический долг"
 mk_soy.8.d:0 "Проекты встали, инвесторы пишут гневные письма."
 mk_soy.8.a:0 "Чрезвычайные меры"
 mk_soy.8.b:0 "Купить лояльность"
 mk_soy.8.c:0 "Свалить вину на соседей"
 mk_soy.9.t:0 "Пузырь стартапов"
 mk_soy.9.d:0 "Каждый второй гражданин — основатель. Экономисты нервничают."
 mk_soy.9.a:0 "Использовать подъём"
 mk_soy.9.b:0 "Сбросить напряжение"
 mk_soy.9.c:0 "Объявить исторический момент"
 mk_soy.10.t:0 "Экономика платформ"
 mk_soy.10.d:0 "Республика запускает национальную платформу. На ней работает всё, даже заводы."
 mk_soy.10.a:0 "Новые заводы"
 mk_soy.10.b:0 "Инженерные бюро"
 mk_soy.10.c:0 "Военный заказ"
 mk_soy.11.t:0 "Армия-сервис"
 mk_soy.11.d:0 "Министерство обороны теперь продаёт подписку на безопасность. Соседи думают."
 mk_soy.11.a:0 "Подготовить повод к войне"
 mk_soy.11.b:0 "Только оборона"
 mk_soy.11.c:0 "Показательные манёвры"
 mk_soy.12.t:0 "Голос Республики"
 mk_soy.12.d:0 "На Конгрессе слушают Соевую Республику: у неё лучшие презентации."
 mk_soy.12.a:0 "Голос на Конгрессе"
 mk_soy.12.b:0 "Друзья по всей Казуалии"
 mk_soy.12.c:0 "Сколотить идеологический блок"
 mk_soy.13.t:0 "Соевая Республика открыла исходники государства"
 mk_soy.13.d:0 "Любой гражданин Казуалии может сделать pull request к конституции Соевой Республики."
 mk_soy.13.a:0 "Fork allowed"
 mk_soy.14.t:0 "Новый союзник"
 mk_soy.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_soy.14.a:0 "Укрепить договор"
 mk_soy.14.b:0 "Сразу требовать большего"
 mk_soy.15.t:0 "Слух из кабинетов"
 mk_soy.15.d:0 "В коридорах Соевая Республика шепчутся о новом курсе. Народ ждёт сигнала."
 mk_soy.15.a:0 "Разогнать слух"
 mk_soy.15.b:0 "Официально опровергнуть"
 mk_soy.15.c:0 "Подлить масла"
 mk_soy.16.t:0 "Повод на столе генштаба"
 mk_soy.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_soy.16.a:0 "Жёсткий ультиматум"
 mk_soy.16.b:0 "Тихая подготовка"
 mk_soy.16.c:0 "Отложить"
 mk_soy.17.t:0 "Тихий торг эпохи"
 mk_soy.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_soy.17.a:0 "Принять сделку"
 mk_soy.17.b:0 "Торговаться жёстче"
 mk_soy.17.c:0 "Отказаться"
 mk_soy.18.t:0 "Утечка из секретного архива"
 mk_soy.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_soy.18.a:0 "Засекретить обратно"
 mk_soy.18.b:0 "Опубликовать выборочно"
 mk_soy.18.c:0 "Обвинить соседей"
 mk_soy.19.t:0 "Идеологический саммит"
 mk_soy.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_soy.19.a:0 "Сколотить альянс сейчас"
 mk_soy.19.b:0 "Сначала мнения"
 mk_soy.19.c:0 "Только протокол"
