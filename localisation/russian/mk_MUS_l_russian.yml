 mk_mus.1.t:0 "Тронная речь"
 mk_mus.1.d:0 "Мусина Алина Маратовна произносит тронную речь. Обе палаты аплодируют — каждая по своей причине."
 mk_mus.1.a:0 "Ставка на «Корона ↔ Парламент»"
 mk_mus.1.b:0 "Созвать парламент"
 mk_mus.2.t:0 "Баланс сохранён"
 mk_mus.2.d:0 "Королева и спикер выходят на балкон вместе. Толпа ликует."
 mk_mus.2.a:0 "Вперёд, без оглядки"
 mk_mus.2.b:0 "Международные наблюдатели"
 mk_mus.3.t:0 "Парламент распущен"
 mk_mus.3.d:0 "Королева распускает Парламент. Депутаты получают по королевскому сувениру."
 mk_mus.3.a:0 "Вперёд, без оглядки"
 mk_mus.3.b:0 "Тихая стабилизация"
 mk_mus.4.t:0 "Корона в музей"
 mk_mus.4.d:0 "Мусина лично относит корону в национальный музей. Билеты раскуплены."
 mk_mus.4.a:0 "Вперёд, без оглядки"
 mk_mus.4.b:0 "Экспорт лозунгов соседям"
 mk_mus.5.t:0 "Авангард Короны"
 mk_mus.5.d:0 "На улицах появляются марширующие отряды в королевских цветах."
 mk_mus.5.a:0 "Вперёд, без оглядки"
 mk_mus.5.b:0 "Вплести код НПТ в курс"
 mk_mus.6.t:0 "Королева в каждом телефоне"
 mk_mus.6.d:0 "Аналитики фиксируют: портрет Королевы стал самым популярным мемом Казуалии."
 mk_mus.6.a:0 "Открыть тайну миру"
 mk_mus.6.b:0 "Засекретить всё"
 mk_mus.7.t:0 "Парламентский триумф"
 mk_mus.7.d:0 "Сильный Парламент провёл пакет реформ за одну ночь."
 mk_mus.7.a:0 "Выжать максимум"
 mk_mus.7.b:0 "Распределить выгоды"
 mk_mus.7.c:0 "Купить голос на Конгрессе"
 mk_mus.8.t:0 "Корона всевластна"
 mk_mus.8.d:0 "Парламент почти не собирается. Королевство тревожится."
 mk_mus.8.a:0 "Чрезвычайные меры"
 mk_mus.8.b:0 "Купить лояльность"
 mk_mus.8.c:0 "Свалить вину на соседей"
 mk_mus.9.t:0 "Парламент всевластен"
 mk_mus.9.d:0 "Депутаты обсуждают, нужна ли вообще Корона."
 mk_mus.9.a:0 "Использовать подъём"
 mk_mus.9.b:0 "Сбросить напряжение"
 mk_mus.9.c:0 "Объявить исторический момент"
 mk_mus.10.t:0 "Процветающее Королевство"
 mk_mus.10.d:0 "Королевские мануфактуры работают круглосуточно."
 mk_mus.10.a:0 "Новые заводы"
 mk_mus.10.b:0 "Инженерные бюро"
 mk_mus.10.c:0 "Военный заказ"
 mk_mus.11.t:0 "Армия двух палат"
 mk_mus.11.d:0 "Армия присягает и Короне, и Парламенту. Обоим одновременно."
 mk_mus.11.a:0 "Подготовить повод к войне"
 mk_mus.11.b:0 "Только оборона"
 mk_mus.11.c:0 "Показательные манёвры"
 mk_mus.12.t:0 "Очарование Короны"
 mk_mus.12.d:0 "Королевские приёмы стали главным дипломатическим событием Казуалии."
 mk_mus.12.a:0 "Голос на Конгрессе"
 mk_mus.12.b:0 "Друзья по всей Казуалии"
 mk_mus.12.c:0 "Сколотить идеологический блок"
 mk_mus.13.t:0 "Королева-Мем"
 mk_mus.13.d:0 "Мусина Алина Маратовна официально признана самой узнаваемой правительницей Казуалии."
 mk_mus.13.a:0 "Да здравствует Королева!"
 mk_mus.14.t:0 "Новый союзник"
 mk_mus.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_mus.14.a:0 "Укрепить договор"
 mk_mus.14.b:0 "Сразу требовать большего"
 mk_mus.15.t:0 "Слух из кабинетов"
 mk_mus.15.d:0 "В коридорах Королевство Муси шепчутся о новом курсе. Народ ждёт сигнала."
 mk_mus.15.a:0 "Разогнать слух"
 mk_mus.15.b:0 "Официально опровергнуть"
 mk_mus.15.c:0 "Подлить масла"
 mk_mus.16.t:0 "Повод на столе генштаба"
 mk_mus.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_mus.16.a:0 "Жёсткий ультиматум"
 mk_mus.16.b:0 "Тихая подготовка"
 mk_mus.16.c:0 "Отложить"
 mk_mus.17.t:0 "Тихий торг эпохи"
 mk_mus.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_mus.17.a:0 "Принять сделку"
 mk_mus.17.b:0 "Торговаться жёстче"
 mk_mus.17.c:0 "Отказаться"
 mk_mus.18.t:0 "Утечка из секретного архива"
 mk_mus.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_mus.18.a:0 "Засекретить обратно"
 mk_mus.18.b:0 "Опубликовать выборочно"
