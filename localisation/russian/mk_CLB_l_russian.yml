 mk_clb.1.t:0 "План инженеров"
 mk_clb.1.d:0 "Иванов Константин Алексеевич представляет программу. Вместо речи — графики."
 mk_clb.1.a:0 "Ставка на «Технократический индекс»"
 mk_clb.1.b:0 "Укрепить аппарат"
 mk_clb.2.t:0 "Расчёт подтверждён"
 mk_clb.2.d:0 "Иванов публикует пятилетний план с формулами вместо лозунгов."
 mk_clb.2.a:0 "Вперёд, без оглядки"
 mk_clb.2.b:0 "Тихая стабилизация"
 mk_clb.3.t:0 "Сталь и порядок"
 mk_clb.3.d:0 "Иванов надевает каску директора и мундир командующего."
 mk_clb.3.a:0 "Вперёд, без оглядки"
 mk_clb.3.b:0 "Вплести код НПТ в курс"
 mk_clb.4.t:0 "Выборы инженеров"
 mk_clb.4.d:0 "На выборах победила партия, программа которой — техническое задание."
 mk_clb.4.a:0 "Вперёд, без оглядки"
 mk_clb.4.b:0 "Международные наблюдатели"
 mk_clb.5.t:0 "План по ЭВМ"
 mk_clb.5.d:0 "Иванов поручает составление плана вычислительному центру."
 mk_clb.5.a:0 "Вперёд, без оглядки"
 mk_clb.5.b:0 "Экспорт лозунгов соседям"
 mk_clb.6.t:0 "Реактор запущен"
 mk_clb.6.d:0 "Инженеры докладывают: реактор работает. Стрелки приборов — за пределами шкалы."
 mk_clb.6.a:0 "Открыть тайну миру"
 mk_clb.6.b:0 "Засекретить всё"
 mk_clb.7.t:0 "Сверхпроект"
 mk_clb.7.d:0 "Вся промышленность Челябы работает на один проект. Он почти готов."
 mk_clb.7.a:0 "Выжать максимум"
 mk_clb.7.b:0 "Распределить выгоды"
 mk_clb.7.c:0 "Купить голос на Конгрессе"
 mk_clb.8.t:0 "Бюрократия побеждает"
 mk_clb.8.d:0 "Инженеры жалуются: чертёж согласовывают уже полгода."
 mk_clb.8.a:0 "Чрезвычайные меры"
 mk_clb.8.b:0 "Купить лояльность"
 mk_clb.8.c:0 "Свалить вину на соседей"
 mk_clb.9.t:0 "Техногенная авария"
 mk_clb.9.d:0 "Очередной эксперимент вышел из-под контроля. Цех пострадал, но расчёты подтвердились."
 mk_clb.9.a:0 "Использовать подъём"
 mk_clb.9.b:0 "Сбросить напряжение"
 mk_clb.9.c:0 "Объявить исторический момент"
 mk_clb.10.t:0 "Кузница Казуалии"
 mk_clb.10.d:0 "Заводы Челябы производят треть стали Казуалии."
 mk_clb.10.a:0 "Новые заводы"
 mk_clb.10.b:0 "Инженерные бюро"
 mk_clb.10.c:0 "Военный заказ"
 mk_clb.11.t:0 "Армия машин"
 mk_clb.11.d:0 "Танковые заводы Челябы выпустили первую серию новых машин."
 mk_clb.11.a:0 "Подготовить повод к войне"
 mk_clb.11.b:0 "Только оборона"
 mk_clb.11.c:0 "Показательные манёвры"
 mk_clb.12.t:0 "Технический альянс"
 mk_clb.12.d:0 "Соседи покупают станки Челябы и просят прислать инженеров."
 mk_clb.12.a:0 "Голос на Конгрессе"
 mk_clb.12.b:0 "Друзья по всей Казуалии"
 mk_clb.12.c:0 "Сколотить идеологический блок"
 mk_clb.13.t:0 "Челябинский реактор"
 mk_clb.13.d:0 "Челяба запустила реактор, который питает всю страну. Соседи надеются, что он не взорвётся."
 mk_clb.13.a:0 "Энергия будущего"
 mk_clb.14.t:0 "Новый союзник"
 mk_clb.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_clb.14.a:0 "Укрепить договор"
 mk_clb.14.b:0 "Сразу требовать большего"
 mk_clb.15.t:0 "Слух из кабинетов"
 mk_clb.15.d:0 "В коридорах Челяба шепчутся о новом курсе. Народ ждёт сигнала."
 mk_clb.15.a:0 "Разогнать слух"
 mk_clb.15.b:0 "Официально опровергнуть"
 mk_clb.15.c:0 "Подлить масла"
 mk_clb.16.t:0 "Повод на столе генштаба"
 mk_clb.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_clb.16.a:0 "Жёсткий ультиматум"
 mk_clb.16.b:0 "Тихая подготовка"
 mk_clb.16.c:0 "Отложить"
 mk_clb.17.t:0 "Тихий торг эпохи"
 mk_clb.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_clb.17.a:0 "Принять сделку"
 mk_clb.17.b:0 "Торговаться жёстче"
 mk_clb.17.c:0 "Отказаться"
 mk_clb.18.t:0 "Утечка из секретного архива"
 mk_clb.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_clb.18.a:0 "Засекретить обратно"
 mk_clb.18.b:0 "Опубликовать выборочно"
 mk_clb.18.c:0 "Обвинить соседей"
 mk_clb.19.t:0 "Идеологический саммит"
 mk_clb.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_clb.19.a:0 "Сколотить альянс сейчас"
 mk_clb.19.b:0 "Сначала мнения"
 mk_clb.19.c:0 "Только протокол"
