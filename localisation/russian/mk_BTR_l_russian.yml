 mk_btr.1.t:0 "Двоевластие начинается"
 mk_btr.1.d:0 "Ахтямов Камиль Наилевич открывает заседание. Половина зала — анархисты, половина — гвардия. Все вооружены."
 mk_btr.1.a:0 "Ставка на «Двойная власть»"
 mk_btr.1.b:0 "Тихо подключить ячейки НПТ"
 mk_btr.2.t:0 "Парадокс сохранён"
 mk_btr.2.d:0 "Ахтямов подтверждает: Тартария будет анархо-фашистской. Логики не ждите."
 mk_btr.2.a:0 "Вперёд, без оглядки"
 mk_btr.2.b:0 "Вплести код НПТ в курс"
 mk_btr.3.t:0 "Порядок наведён"
 mk_btr.3.d:0 "Ахтямов распускает свободные ячейки. Самые свободные из них — силой."
 mk_btr.3.a:0 "Вперёд, без оглядки"
 mk_btr.3.b:0 "Вплести код НПТ в курс"
 mk_btr.4.t:0 "Коммуна провозглашена"
 mk_btr.4.d:0 "Ахтямов уходит из кабинета на общее собрание. Кабинет теперь — общий."
 mk_btr.4.a:0 "Вперёд, без оглядки"
 mk_btr.4.b:0 "Экспорт лозунгов соседям"
 mk_btr.5.t:0 "Выборы в Тартарии"
 mk_btr.5.d:0 "Первые выборы прошли бурно. Проиграли все, но страна выиграла."
 mk_btr.5.a:0 "Вперёд, без оглядки"
 mk_btr.5.b:0 "Международные наблюдатели"
 mk_btr.6.t:0 "Код пробуждается"
 mk_btr.6.d:0 "В архиве Чёрной гвардии нашли исходники НПТ. Они компилируются."
 mk_btr.6.a:0 "Открыть тайну миру"
 mk_btr.6.b:0 "Засекретить всё"
 mk_btr.7.t:0 "Единый удар"
 mk_btr.7.d:0 "Вертикаль на пике силы. Тартария движется как одно тело."
 mk_btr.7.a:0 "Выжать максимум"
 mk_btr.7.b:0 "Распределить выгоды"
 mk_btr.7.c:0 "Купить голос на Конгрессе"
 mk_btr.8.t:0 "Ячейки вышли из-под контроля"
 mk_btr.8.d:0 "Ячейки объявили автономию. Некоторые — друг от друга."
 mk_btr.8.a:0 "Чрезвычайные меры"
 mk_btr.8.b:0 "Купить лояльность"
 mk_btr.8.c:0 "Свалить вину на соседей"
 mk_btr.9.t:0 "Железная вертикаль"
 mk_btr.9.d:0 "Порядок абсолютен. Анархисты ушли в подполье — снова."
 mk_btr.9.a:0 "Использовать подъём"
 mk_btr.9.b:0 "Сбросить напряжение"
 mk_btr.9.c:0 "Объявить исторический момент"
 mk_btr.10.t:0 "Экономика сопротивления"
 mk_btr.10.d:0 "Подпольные артели вышли на поверхность и стали крупнейшими заводами страны."
 mk_btr.10.a:0 "Новые заводы"
 mk_btr.10.b:0 "Инженерные бюро"
 mk_btr.10.c:0 "Военный заказ"
 mk_btr.11.t:0 "Чёрная армия"
 mk_btr.11.d:0 "Чёрная армия готова. Соседи нервно проверяют границы."
 mk_btr.11.a:0 "Подготовить повод к войне"
 mk_btr.11.b:0 "Только оборона"
 mk_btr.11.c:0 "Показательные манёвры"
 mk_btr.12.t:0 "Тартария говорит"
 mk_btr.12.d:0 "Делегация Тартарии на Конгрессе — и зал слушает, затаив дыхание."
 mk_btr.12.a:0 "Голос на Конгрессе"
 mk_btr.12.b:0 "Друзья по всей Казуалии"
 mk_btr.12.c:0 "Сколотить идеологический блок"
 mk_btr.13.t:0 "Чёрный код Тартарии"
 mk_btr.13.d:0 "Чёрная Тартария объявила код Национал-Программистов Татарстана священным текстом."
 mk_btr.13.a:0 "Мир содрогается"
 mk_btr.14.t:0 "Новый союзник"
 mk_btr.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_btr.14.a:0 "Укрепить договор"
 mk_btr.14.b:0 "Сразу требовать большего"
 mk_btr.15.t:0 "Слух из кабинетов"
 mk_btr.15.d:0 "В коридорах Чёрная Тартария шепчутся о новом курсе. Народ ждёт сигнала."
 mk_btr.15.a:0 "Разогнать слух"
 mk_btr.15.b:0 "Официально опровергнуть"
 mk_btr.15.c:0 "Подлить масла"
 mk_btr.16.t:0 "Повод на столе генштаба"
 mk_btr.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_btr.16.a:0 "Жёсткий ультиматум"
 mk_btr.16.b:0 "Тихая подготовка"
 mk_btr.16.c:0 "Отложить"
 mk_btr.17.t:0 "Тихий торг эпохи"
 mk_btr.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_btr.17.a:0 "Принять сделку"
 mk_btr.17.b:0 "Торговаться жёстче"
 mk_btr.17.c:0 "Отказаться"
 mk_btr.18.t:0 "Утечка из секретного архива"
 mk_btr.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_btr.18.a:0 "Засекретить обратно"
 mk_btr.18.b:0 "Опубликовать выборочно"
 mk_btr.18.c:0 "Обвинить соседей"
 mk_btr.19.t:0 "Идеологический саммит"
 mk_btr.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_btr.19.a:0 "Сколотить альянс сейчас"
 mk_btr.19.b:0 "Сначала мнения"
 mk_btr.19.c:0 "Только протокол"
