 mk_sva.1.t:0 "Доклад Ассамблее"
 mk_sva.1.d:0 "Арифуллин Саид Аскарович представляет программу — в виде научного доклада с приложениями."
 mk_sva.1.a:0 "Ставка на «Научные советы ↔ парламент»"
 mk_sva.1.b:0 "Созвать парламент"
 mk_sva.2.t:0 "Баланс сохранён"
 mk_sva.2.d:0 "Арифуллин подписывает закон о научной экспертизе всех законов."
 mk_sva.2.a:0 "Вперёд, без оглядки"
 mk_sva.2.b:0 "Международные наблюдатели"
 mk_sva.3.t:0 "Академия у власти"
 mk_sva.3.d:0 "Арифуллин передаёт полномочия президиуму Академии."
 mk_sva.3.a:0 "Вперёд, без оглядки"
 mk_sva.3.b:0 "Тихая стабилизация"
 mk_sva.4.t:0 "Наука — народу"
 mk_sva.4.d:0 "Арифуллин национализирует лаборатории и открывает их для всех."
 mk_sva.4.a:0 "Вперёд, без оглядки"
 mk_sva.4.b:0 "Экспорт лозунгов соседям"
 mk_sva.5.t:0 "Холодный порядок"
 mk_sva.5.d:0 "Арифуллин объявляет чрезвычайное положение «до весны». Весны на Севере нет."
 mk_sva.5.a:0 "Вперёд, без оглядки"
 mk_sva.5.b:0 "Вплести код НПТ в курс"
 mk_sva.6.t:0 "Сияние над Севером"
 mk_sva.6.d:0 "Учёные запустили установку. Небо над столицей светится."
 mk_sva.6.a:0 "Открыть тайну миру"
 mk_sva.6.b:0 "Засекретить всё"
 mk_sva.7.t:0 "Северная программа"
 mk_sva.7.d:0 "Научные советы сосредоточились на одной задаче. Прорыв близок."
 mk_sva.7.a:0 "Выжать максимум"
 mk_sva.7.b:0 "Распределить выгоды"
 mk_sva.7.c:0 "Купить голос на Конгрессе"
 mk_sva.8.t:0 "Парламент против учёных"
 mk_sva.8.d:0 "Депутаты урезали гранты. Учёные пишут открытое письмо."
 mk_sva.8.a:0 "Чрезвычайные меры"
 mk_sva.8.b:0 "Купить лояльность"
 mk_sva.8.c:0 "Свалить вину на соседей"
 mk_sva.9.t:0 "Технократический перекос"
 mk_sva.9.d:0 "Советы отклонили закон о бюджете: «недостаточно данных»."
 mk_sva.9.a:0 "Использовать подъём"
 mk_sva.9.b:0 "Сбросить напряжение"
 mk_sva.9.c:0 "Объявить исторический момент"
 mk_sva.10.t:0 "Торговая Ассамблея"
 mk_sva.10.d:0 "Северные порты принимают корабли со всей Казуалии."
 mk_sva.10.a:0 "Новые заводы"
 mk_sva.10.b:0 "Инженерные бюро"
 mk_sva.10.c:0 "Военный заказ"
 mk_sva.11.t:0 "Армия знаний"
 mk_sva.11.d:0 "Новое оборудование армии засекречено даже от генералов."
 mk_sva.11.a:0 "Подготовить повод к войне"
 mk_sva.11.b:0 "Только оборона"
 mk_sva.11.c:0 "Показательные манёвры"
 mk_sva.12.t:0 "Северный союз"
 mk_sva.12.d:0 "Соседи присылают студентов и подписывают торговые договоры."
 mk_sva.12.a:0 "Голос на Конгрессе"
 mk_sva.12.b:0 "Друзья по всей Казуалии"
 mk_sva.12.c:0 "Сколотить идеологический блок"
 mk_sva.13.t:0 "Северное сияние"
 mk_sva.13.d:0 "Северная Ассамблея получила технологию, которую никто не может повторить. Небо над ней светится."
 mk_sva.13.a:0 "Знание сияет"
 mk_sva.14.t:0 "Новый союзник"
 mk_sva.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_sva.14.a:0 "Укрепить договор"
 mk_sva.14.b:0 "Сразу требовать большего"
 mk_sva.15.t:0 "Слух из кабинетов"
 mk_sva.15.d:0 "В коридорах Северная Ассамблея шепчутся о новом курсе. Народ ждёт сигнала."
 mk_sva.15.a:0 "Разогнать слух"
 mk_sva.15.b:0 "Официально опровергнуть"
 mk_sva.15.c:0 "Подлить масла"
 mk_sva.16.t:0 "Повод на столе генштаба"
 mk_sva.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_sva.16.a:0 "Жёсткий ультиматум"
 mk_sva.16.b:0 "Тихая подготовка"
 mk_sva.16.c:0 "Отложить"
 mk_sva.17.t:0 "Тихий торг эпохи"
 mk_sva.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_sva.17.a:0 "Принять сделку"
 mk_sva.17.b:0 "Торговаться жёстче"
 mk_sva.17.c:0 "Отказаться"
 mk_sva.18.t:0 "Утечка из секретного архива"
 mk_sva.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
