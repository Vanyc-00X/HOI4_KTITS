 CRE_secret_resources:0 "Секретные залежи ресурсов"
 CRE_secret_resources_desc:0 "В горах вокруг Рима обнаружены колоссальные залежи стратегического сырья."
 CRE_secret_resources_tt:0 "В стейте §YРим (Latium)§! добавляется по §Y24§! нефти, алюминия, резины, вольфрама, стали, хрома и угля."
 CRE_blueprints_future:0 "Чертежи из будущего"
 CRE_blueprints_future_desc:0 "Из казуальной аномалии — схемы танков, которых ещё нет. Год работы штабов."
 CRE_blueprints_future_tt:0 "Создаёт §Y24§! ветеранские танковые дивизии с усиленной ПП и ПТ атакой."
 CRE_blueprints_infantry:0 "Позвать Black Division"
 CRE_blueprints_infantry_desc:0 "Призвать Black Division: 42 ветеранские пехотные дивизии с мобильной ракетной артиллерией."
 CRE_blueprints_infantry_tt:0 "Создаёт §Y42§! ветеранские дивизии §YBlack Division§! (пехота + мобильная ракетная артиллерия)."
 CRE_idea_future_tanks:0 "Танки из будущего"
 CRE_idea_future_tanks_desc:0 "Бронетехника Феникса бьёт сильнее обычной."
 CRE_idea_future_infantry:0 "Пехота будущего"
 CRE_idea_future_infantry_desc:0 "Пехота и РСЗО Феникса с аномальным уроном."
 CRE_returned_fuhrer:0 "Вернувшийся Фюрер"
