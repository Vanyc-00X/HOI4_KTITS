 mk_trf.1.t:0 "Манифест коммун"
 mk_trf.1.d:0 "Чазов Георгий Алексеевич читает манифест на поляне. Решение принято, когда допели последнюю песню."
 mk_trf.1.a:0 "Ставка на «Коммунальный консенсус»"
 mk_trf.1.b:0 "Собрать советы на площадях"
 mk_trf.2.t:0 "Коммуны едины"
 mk_trf.2.d:0 "Чазов поёт на общем собрании. Решение принято хором."
 mk_trf.2.a:0 "Вперёд, без оглядки"
 mk_trf.2.b:0 "Экспорт лозунгов соседям"
 mk_trf.3.t:0 "Первые выборы коммун"
 mk_trf.3.d:0 "Коммуны впервые выбирают парламент. Бюллетени напечатаны на переработанной бумаге."
 mk_trf.3.a:0 "Вперёд, без оглядки"
 mk_trf.3.b:0 "Международные наблюдатели"
 mk_trf.4.t:0 "Лес требует порядка"
 mk_trf.4.d:0 "Чазов меняет венок на фуражку. Коммуны в замешательстве."
 mk_trf.4.a:0 "Вперёд, без оглядки"
 mk_trf.4.b:0 "Вплести код НПТ в курс"
 mk_trf.5.t:0 "Ретрит объявлен"
 mk_trf.5.d:0 "Границы Федерации закрываются на медитацию. Бессрочную."
 mk_trf.5.a:0 "Вперёд, без оглядки"
 mk_trf.5.b:0 "Тихая стабилизация"
 mk_trf.6.t:0 "Цветы для всех"
 mk_trf.6.d:0 "Коммуны предлагают отправить делегации с цветами к соседям. И с листовками."
 mk_trf.6.a:0 "Открыть тайну миру"
 mk_trf.6.b:0 "Засекретить всё"
 mk_trf.7.t:0 "Великий субботник"
 mk_trf.7.d:0 "Все коммуны вышли работать на общее дело. За неделю построено больше, чем за год."
 mk_trf.7.a:0 "Выжать максимум"
 mk_trf.7.b:0 "Распределить выгоды"
 mk_trf.7.c:0 "Купить голос на Конгрессе"
 mk_trf.8.t:0 "Коммуны расходятся"
 mk_trf.8.d:0 "Несколько коммун объявили, что уходят своей тропой."
 mk_trf.8.a:0 "Чрезвычайные меры"
 mk_trf.8.b:0 "Купить лояльность"
 mk_trf.8.c:0 "Свалить вину на соседей"
 mk_trf.9.t:0 "Единый круг"
 mk_trf.9.d:0 "Консенсус абсолютен. Даже споры о погоде прекратились."
 mk_trf.9.a:0 "Использовать подъём"
 mk_trf.9.b:0 "Сбросить напряжение"
 mk_trf.9.c:0 "Объявить исторический момент"
 mk_trf.10.t:0 "Изобилие коммун"
 mk_trf.10.d:0 "Общинные мастерские производят больше, чем коммуны успевают раздать."
 mk_trf.10.a:0 "Новые заводы"
 mk_trf.10.b:0 "Инженерные бюро"
 mk_trf.10.c:0 "Военный заказ"
 mk_trf.11.t:0 "Лес как крепость"
 mk_trf.11.d:0 "Генштаб коммун докладывает: лес готов к обороне. Лес согласен."
 mk_trf.11.a:0 "Подготовить повод к войне"
 mk_trf.11.b:0 "Только оборона"
 mk_trf.11.c:0 "Показательные манёвры"
 mk_trf.12.t:0 "Добрые соседи"
 mk_trf.12.d:0 "Соседи приезжают на фестивали Федерации — и уезжают друзьями."
 mk_trf.12.a:0 "Голос на Конгрессе"
 mk_trf.12.b:0 "Друзья по всей Казуалии"
 mk_trf.12.c:0 "Сколотить идеологический блок"
 mk_trf.13.t:0 "Цветочная революция"
 mk_trf.13.d:0 "Травинная Федерация объявила Цветочную революцию. Соседи получают цветы и не знают, бояться ли."
 mk_trf.13.a:0 "Мир — коммунам!"
 mk_trf.14.t:0 "Новый союзник"
 mk_trf.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_trf.14.a:0 "Укрепить договор"
 mk_trf.14.b:0 "Сразу требовать большего"
 mk_trf.15.t:0 "Слух из кабинетов"
 mk_trf.15.d:0 "В коридорах Травинная Федерация шепчутся о новом курсе. Народ ждёт сигнала."
 mk_trf.15.a:0 "Разогнать слух"
 mk_trf.15.b:0 "Официально опровергнуть"
 mk_trf.15.c:0 "Подлить масла"
 mk_trf.16.t:0 "Повод на столе генштаба"
 mk_trf.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_trf.16.a:0 "Жёсткий ультиматум"
 mk_trf.16.b:0 "Тихая подготовка"
 mk_trf.16.c:0 "Отложить"
 mk_trf.17.t:0 "Тихий торг эпохи"
 mk_trf.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_trf.17.a:0 "Принять сделку"
 mk_trf.17.b:0 "Торговаться жёстче"
 mk_trf.17.c:0 "Отказаться"
 mk_trf.18.t:0 "Утечка из секретного архива"
 mk_trf.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_trf.18.a:0 "Засекретить обратно"
 mk_trf.18.b:0 "Опубликовать выборочно"
 mk_trf.18.c:0 "Обвинить соседей"
 mk_trf.19.t:0 "Идеологический саммит"
 mk_trf.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_trf.19.a:0 "Сколотить альянс сейчас"
 mk_trf.19.b:0 "Сначала мнения"
 mk_trf.19.c:0 "Только протокол"
