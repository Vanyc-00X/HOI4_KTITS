 mk_cat_VCI:0 "Индекс Казуальности"
 mk_cat_VCI_desc:0 "Чем рискованнее решения Императорского двора, тем выше Индекс. Высокий Индекс даёт власть и размах, но будит гражданские волнения.\n\n§YИндекс Казуальности:§! [?mk_mech|0] / 100"
