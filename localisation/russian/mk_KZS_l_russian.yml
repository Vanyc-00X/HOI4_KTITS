 KZS_dec_campaign_b_desc:0 "Мобилизовать сторонников курса «Вольные станицы»."
 KZS_dec_campaign_c:0 "Кампания: Красное казачество"
 KZS_dec_campaign_c_desc:0 "Мобилизовать сторонников курса «Красное казачество»."
 mk_kzs.1.t:0 "Круг собрался"
 mk_kzs.1.d:0 "Дарья Юзеева открывает Круг. Атаманы спорят уже до первого слова."
 mk_kzs.1.a:0 "Ставка на «Сила Круга»"
 mk_kzs.1.b:0 "Укрепить аппарат"
 mk_kzs.2.t:0 "Верность традиции"
 mk_kzs.2.d:0 "Дарья Юзеева клянётся перед Кругом хранить веру и рубежи."
 mk_kzs.2.a:0 "Вперёд, без оглядки"
 mk_kzs.2.b:0 "Тихая стабилизация"
 mk_kzs.3.t:0 "Атаман всех станиц"
 mk_kzs.3.d:0 "Круг вручает Юзеевой булаву. Возражений не поступило."
 mk_kzs.3.a:0 "Вперёд, без оглядки"
 mk_kzs.3.b:0 "Вплести код НПТ в курс"
 mk_kzs.4.t:0 "Вольные выборы"
 mk_kzs.4.d:0 "Станицы впервые выбирают атаманов тайным голосованием."
 mk_kzs.4.a:0 "Вперёд, без оглядки"
 mk_kzs.4.b:0 "Международные наблюдатели"
 mk_kzs.5.t:0 "Красный Круг"
 mk_kzs.5.d:0 "Круг голосует за коммуны. Самые богатые атаманы голосуют против — и проигрывают."
 mk_kzs.5.a:0 "Вперёд, без оглядки"
 mk_kzs.5.b:0 "Экспорт лозунгов соседям"
 mk_kzs.6.t:0 "Зов Великого Круга"
 mk_kzs.6.d:0 "Атаманы предлагают позвать на Круг соседние народы."
 mk_kzs.6.a:0 "Открыть тайну миру"
 mk_kzs.6.b:0 "Засекретить всё"
 mk_kzs.7.t:0 "Решение Круга"
 mk_kzs.7.d:0 "Единый Круг принял решение. Станицы исполняют без споров."
 mk_kzs.7.a:0 "Выжать максимум"
 mk_kzs.7.b:0 "Распределить выгоды"
 mk_kzs.7.c:0 "Купить голос на Конгрессе"
 mk_kzs.8.t:0 "Раскол Круга"
 mk_kzs.8.d:0 "Атаманы покидают Круг, хлопнув дверью."
 mk_kzs.8.a:0 "Чрезвычайные меры"
 mk_kzs.8.b:0 "Купить лояльность"
 mk_kzs.8.c:0 "Свалить вину на соседей"
 mk_kzs.9.t:0 "Круг един как никогда"
 mk_kzs.9.d:0 "Станицы говорят одним голосом. Соседи прислушиваются."
 mk_kzs.9.a:0 "Использовать подъём"
 mk_kzs.9.b:0 "Сбросить напряжение"
 mk_kzs.9.c:0 "Объявить исторический момент"
 mk_kzs.10.t:0 "Хозяйство станиц"
 mk_kzs.10.d:0 "Станичные мастерские выросли в настоящую промышленность."
 mk_kzs.10.a:0 "Новые заводы"
 mk_kzs.10.b:0 "Инженерные бюро"
 mk_kzs.10.c:0 "Военный заказ"
 mk_kzs.11.t:0 "Рубежи на замке"
 mk_kzs.11.d:0 "Казачьи полки заняли рубежи. Никто не пройдёт."
 mk_kzs.11.a:0 "Подготовить повод к войне"
 mk_kzs.11.b:0 "Только оборона"
 mk_kzs.11.c:0 "Показательные манёвры"
 mk_kzs.12.t:0 "Добрая слава"
 mk_kzs.12.d:0 "Слава Казачьих штатов идёт впереди их послов."
 mk_kzs.12.a:0 "Голос на Конгрессе"
 mk_kzs.12.b:0 "Друзья по всей Казуалии"
 mk_kzs.12.c:0 "Сколотить идеологический блок"
 mk_kzs.13.t:0 "Великий Круг созван"
 mk_kzs.13.d:0 "Казачьи штаты созвали Великий Круг и пригласили на него всю Казуалию."
 mk_kzs.13.a:0 "Шашки наголо?"
 mk_kzs.14.t:0 "Новый союзник"
 mk_kzs.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_kzs.14.a:0 "Укрепить договор"
 mk_kzs.14.b:0 "Сразу требовать большего"
 mk_kzs.15.t:0 "Слух из кабинетов"
 mk_kzs.15.d:0 "В коридорах Казачьи штаты шепчутся о новом курсе. Народ ждёт сигнала."
 mk_kzs.15.a:0 "Разогнать слух"
 mk_kzs.15.b:0 "Официально опровергнуть"
 mk_kzs.15.c:0 "Подлить масла"
 mk_kzs.16.t:0 "Повод на столе генштаба"
 mk_kzs.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_kzs.16.a:0 "Жёсткий ультиматум"
 mk_kzs.16.b:0 "Тихая подготовка"
 mk_kzs.16.c:0 "Отложить"
 mk_kzs.17.t:0 "Тихий торг эпохи"
 mk_kzs.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_kzs.17.a:0 "Принять сделку"
 mk_kzs.17.b:0 "Торговаться жёстче"
 mk_kzs.17.c:0 "Отказаться"
 mk_kzs.18.t:0 "Утечка из секретного архива"
 mk_kzs.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_kzs.18.a:0 "Засекретить обратно"
 mk_kzs.18.b:0 "Опубликовать выборочно"
 mk_kzs.18.c:0 "Обвинить соседей"
 mk_kzs.19.t:0 "Идеологический саммит"
 mk_kzs.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_kzs.19.a:0 "Сколотить альянс сейчас"
 mk_kzs.19.b:0 "Сначала мнения"
 mk_kzs.19.c:0 "Только протокол"
