 mk_cat_KRZ:0 "Революционный экспорт"
 mk_cat_KRZ_desc:0 "Очки революционного экспорта копятся с каждой победой Красной Земли. Высокие очки позволяют разжигать революции у соседей.\n\n§YРеволюционный экспорт:§! [?mk_mech|0] / 100"
 KRZ_mech_up_tt:0 "Революционный экспорт §Gрастёт§!"
 KRZ_mech_down_tt:0 "Революционный экспорт §Rснижается§!"
 KRZ_dec_raise:0 "Отправить агитаторов"
 KRZ_dec_raise_desc:0 "Агитационные поезда отправляются к границам."
 KRZ_dec_lower:0 "Революция в одной стране"
 KRZ_dec_lower_desc:0 "Сначала построить социализм дома."
 KRZ_dec_exploit:0 "Разжечь революцию"
 KRZ_dec_exploit_desc:0 "Поддержать восстание у соседей всей мощью Красной Земли."
 KRZ_dec_crisis:0 "Партийная чистка"
 KRZ_dec_crisis_desc:0 "Революционный дух угас. Нужен пленум."
 KRZ_dec_campaign_keep:0 "Кампания: Ленинский путь"
 KRZ_dec_campaign_keep_desc:0 "Мобилизовать сторонников курса «Ленинский путь»."
 KRZ_dec_campaign_a:0 "Кампания: Красный национализм"
 KRZ_dec_campaign_a_desc:0 "Мобилизовать сторонников курса «Красный национализм»."
 KRZ_dec_campaign_b:0 "Кампания: Рыночный социализм"
