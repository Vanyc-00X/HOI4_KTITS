 mk_cat_BTR:0 "Двойная власть"
 mk_cat_BTR_desc:0 "0 — анархия побеждает, 100 — авторитаризм забирает всё. Посередине Тартария держится на чистом упрямстве.\n\n§YДвойная власть:§! [?mk_mech|0] / 100"
 BTR_mech_up_tt:0 "Двойная власть §Gрастёт§!"
 BTR_mech_down_tt:0 "Двойная власть §Rснижается§!"
 BTR_dec_raise:0 "Укрепить вертикаль"
 BTR_dec_raise_desc:0 "Назначить комиссаров во все ячейки. Ячейки недовольны."
 BTR_dec_lower:0 "Отпустить ячейки"
 BTR_dec_lower_desc:0 "Дать местным советам больше свободы действовать."
 BTR_dec_exploit:0 "Единый удар"
 BTR_dec_exploit_desc:0 "Пока вертикаль сильна — направить всю страну к одной цели."
 BTR_dec_crisis:0 "Собрать ячейки"
 BTR_dec_crisis_desc:0 "Анархия зашла слишком далеко. Нужен общий сбор."
 BTR_dec_campaign_keep:0 "Кампания: Анархо-фашизм"
 BTR_dec_campaign_keep_desc:0 "Мобилизовать сторонников курса «Анархо-фашизм»."
 BTR_dec_campaign_a:0 "Кампания: Тартарский порядок"
 BTR_dec_campaign_a_desc:0 "Мобилизовать сторонников курса «Тартарский порядок»."
 BTR_dec_campaign_b:0 "Кампания: Анархо-коммуна"
 BTR_dec_campaign_b_desc:0 "Мобилизовать сторонников курса «Анархо-коммуна»."
