l_russian:
 mk_global.1.t:0 "Эра Безумных Правителей"
 mk_global.1.d:0 "Двадцать четыре державы проснулись в мире, где логика — опциональный DLC. Шкала Абсурда уже меняется. Голоса Мира разложены по столам. НПТ пишет первый коммит."
 mk_global.1.a:0 "Поехали."
 mk_global.2.t:0 "Всемирный Конгресс созван"
 mk_global.2.d:0 "Дипломаты Казуалии съезжаются на Конгресс. Каждый голос теперь стоит дороже дивизии."
 mk_global.2.a:0 "Занять места."
 mk_global.3.t:0 "Рождение идеологического блока"
 mk_global.3.d:0 "Новый альянс оформлен по принципу «кто мыслит как мы — тот с нами»."
 mk_global.3.a:0 "История пишется фракциями."
 mk_global.4.t:0 "Великий Политический Поворот"
 mk_global.4.d:0 "Порог пройден. Альтернативные курсы больше не теория — они становятся политикой. Все державы вынуждены выбрать сторону шторма."
 mk_global.4.a:0 "Мир не будет прежним."
 mk_global.5.t:0 "Критический уровень Абсурда"
 mk_global.5.d:0 "Абсурд перевалил за критическую отметку. События ускоряются, а нормы рушатся."
 mk_global.5.a:0 "Держаться за кресло."
 mk_global.10.t:0 "Голосование Всемирного Конгресса"
 mk_global.10.d:0 "Делегатам предстоит решить судьбу обвинённой державы. Вес голоса зависит от влияния страны: большинство может санкционировать совместное объявление войны."
 mk_global.10.a:0 "Поддержать совместное принуждение"
 mk_global.10.b:0 "Отклонить военную резолюцию"
 mk_global.10.c:0 "Воздержаться от голосования"
 mk_global.11.t:0 "Подсчёт голосов Конгресса"
 mk_global.11.d:0 "Всемирный Конгресс завершил взвешенное голосование. Теперь большинство решит, станет ли осуждение мандатом на совместную войну."
 mk_global.11.a:0 "Огласить решение"
 mk_global.12.t:0 "Конгресс санкционировал совместную операцию"
 mk_global.12.d:0 "Большинство голосов поддержало коллективное принуждение. Проголосовавшие «за» державы получили мандат и вступают в войну против осуждённого нарушителя."
 mk_global.12.a:0 "Резолюция вступает в силу"
 mk_global.13.t:0 "Военная резолюция провалена"
 mk_global.13.d:0 "Голосов за совместное нападение оказалось недостаточно. Конгресс не выдал мандат, а сторонники резолюции потеряли часть стабильности."
 mk_global.13.a:0 "Конгресс не договорился"
 mk_global.14.t:0 "Приговор Всемирного Конгресса"
 mk_global.14.d:0 "Ваша страна осуждена за нарушение международных норм. Вы можете отвергнуть решение и мобилизовать население либо принять его, снизить уровень проступков и немедленно прекратить огонь с участниками операции."
 mk_global.14.a:0 "Отвергнуть приговор и сопротивляться"
 mk_global.14.b:0 "Принять решение и прекратить огонь"
 mk_congress_condemnation:0 "Осуждение Всемирного Конгресса"
 mk_congress_condemnation_desc:0 "Держава осуждена международным голосованием за нарушение правил."
 mk_global.20.t:0 "Мы объявили ревизионизм"
 mk_global.20.d:0 "Альянс остался позади. У нас — wargoals, дух ревизиониста и горящий Абсурд."
 mk_global.20.a:0 "Так и задумано"
 mk_global.20.b:0 "Сделать это стилем"
 mk_global.21.t:0 "Давление на ревизиониста"
 mk_global.21.d:0 "Блок мобилизует осуждение. На столе — основание для войны."
 mk_global.21.a:0 "Принято к сведению"
 mk_global.22.t:0 "Раскол альянса: ревизионизм"
 mk_global.22.d:0 "Член блока обвинил союзников в ревизионизме и вышел из альянса. Казуалия затаила дыхание."
 mk_global.22.a:0 "История любит драму"
 mk_global.23.t:0 "Союзник ушёл с обвинениями"
 mk_global.23.d:0 "Вчерашний товарищ объявил нас ревизионистами. У нас есть casus belli — и штраф к атаке на ближайшие месяцы."
 mk_global.23.a:0 "Готовить ответ"
 mk_global.23.b:0 "Сдерживать эскалацию"
 mk_global.24.t:0 "Большинство осудило ревизионизм"
 mk_global.24.d:0 "Блок консолидировался. Осуждение ревизиониста даёт политический заряд."
 mk_global.24.a:0 "Единство прежде всего"
 mk_global.30.t:0 "Приглашение в идеологический блок"
 mk_global.30.d:0 "Нас приняли в альянс единомышленников."
 mk_global.30.a:0 "Отлично."
 mk_global.40.t:0 "Выбор при Великом Повороте"
 mk_global.40.d:0 "Политический шторм требует курса: реформа, закалка или управляемый хаос."
 mk_global.40.a:0 "Реформа"
 mk_global.40.b:0 "Закалка"
 mk_global.40.c:0 "Хаос"
 mk_global.50.t:0 "Эпоха развилок"
 mk_global.50.d:0 "Дни спокойствия кончились. Первые страны меняют курс, Абсурд растёт, альтернативные ветки открыты."
 mk_global.50.a:0 "Выбирать путь"
 mk_global.51.t:0 "Пограничный инцидент"
 mk_global.51.d:0 "На границе стреляли. Кто первый — спорно. Кто виноват — тем более."
 mk_global.51.a:0 "Поднять градус"
 mk_global.51.b:0 "Замять скандал"
 mk_global.52.t:0 "Дипломатический скандал"
 mk_global.52.d:0 "Посол сказал лишнее. Или как раз нужное. Газеты уже печатают заголовки."
 mk_global.52.a:0 "Отречься и извиниться"
 mk_global.52.b:0 "Свалить на НПТ"
 mk_global.53.t:0 "Экономическая тряска"
 mk_global.53.d:0 "Рынки Казуалии качнулись. Кто-то говорит о кризисе, кто-то — о возможности."
 mk_global.53.a:0 "Затянуть пояса"
 mk_global.53.b:0 "Инвестировать в хаос"
 mk_global.54.t:0 "Время блоков"
 mk_global.54.d:0 "Идеологические альянсы оформляются. Малые державы тоже могут возглавить фракцию — если хватит смелости."
 mk_global.54.a:0 "Искать союзников"
 mk_global.55.t:0 "Давление блоков"
 mk_global.55.d:0 "Соседи намекают: пора выбирать сторону. Нейтралитет ещё возможен — но дорожает."
 mk_global.55.a:0 "Играть в большую политику"
 mk_global.55.b:0 "Держать дистанцию"
 mk_global.56.t:0 "Региональные кризисы"
 mk_global.56.d:0 "Обвинения в ревизионизме, пограничные стычки и первые большие войны. Казуалия входит в опасную фазу."
 mk_global.56.a:0 "Держать порох сухим"
 mk_global.57.t:0 "Волна ревизионизма"
 mk_global.57.d:0 "Слово «ревизионист» звучит на каждом заседании. Альянсы трещат."
 mk_global.57.a:0 "Радикализировать риторику"
 mk_global.57.b:0 "Успокоить союзников"
 mk_global.58.t:0 "Глобальная эскалация"
 mk_global.58.d:0 "День 730. Открываются финальные сценарии: дипломатия, идеология, экономика, НПТ, интеграция или чистый Абсурд."
 mk_global.58.a:0 "Конец игры близок"
 mk_global.59.t:0 "Финал Казуалии"
 mk_global.59.d:0 "Мир дозрел до развязки. Выберите путь победы через решения категории «Финалы Казуалии»."
 mk_global.59.a:0 "Готовить военный триумф"
 mk_global.59.b:0 "Готовить дипломатический"
 mk_global.60.t:0 "Абсурдный кризис"
 mk_global.60.d:0 "Случилось то, чего не должно было случиться — и все делают вид, что так и планировали."
 mk_global.60.a:0 "Усилить абсурд"
 mk_global.60.b:0 "Потушить пожар деньгами"
 mk_global.61.t:0 "Шёпот НПТ"
 mk_global.61.d:0 "Ячейки Национал-Программистов просят бюджета, серверов и идеологической крыши."
 mk_global.61.a:0 "Выделить ресурсы"
 mk_global.61.b:0 "Заморозить проект"
 mk_global.62.t:0 "Холодная война мемов"
 mk_global.62.d:0 "На границах идут не танки, а лозунги. Пропаганда работает лучше артиллерии — пока."
 mk_global.62.a:0 "Эскалация лозунгов"
 mk_global.62.b:0 "Купить влияние голосами"
 mk_global.63.t:0 "Финальный протокол НПТ"
 mk_global.63.d:0 "Национал-Программисты объявили, что мир скомпилирован успешно. Секретная концовка НПТ достигнута."
 mk_global.63.a:0 "git push --force reality"
 mk_global.64.t:0 "Мирное собирание земель"
 mk_global.64.d:0 "Карта Казуалии перекрашена без тотальной войны. Интеграционный финал."
 mk_global.64.a:0 "Границы — договорённость"
 mk_global.65.t:0 "Победа Абсурда"
 mk_global.65.d:0 "Критический уровень Абсурда и война сделали своё. Реальность сдалась."
 mk_global.65.a:0 "Логика отключена"
 mk_global.66.t:0 "Дипломатическая гегемония"
 mk_global.66.d:0 "Лидер блока с достаточным числом союзников объявил дипломатическую победу Казуалии."
 mk_global.66.a:0 "Мир через голосование"
 mk_global.67.t:0 "Кризис на границе"
 mk_global.67.d:0 "Соседняя держава провоцирует. Можно ответить жёстко — или купить спокойствие."
 mk_global.67.a:0 "Инцидент неминуем"
 mk_global.67.b:0 "Дипломатический подарок"
 mk_global.69.t:0 "Протокол НПТ"
 mk_global.69.d:0 "Пятый международный блок Казуалии оформлен: Протокол Национал-Программистов."
 mk_global.69.a:0 "Компиляция началась"
 mk_global.70.t:0 "Предложение посредничества"
 mk_global.70.d:0 "Нейтральный посредник предлагает снизить градус конфликта."
 mk_global.70.a:0 "Принять добрую волю"
 mk_global.71.t:0 "Экономический триумф"
 mk_global.71.d:0 "Промышленный индекс страны достиг победного порога. Экономический финал."
 mk_global.71.a:0 "Заводы решают всё"
 mk_global.72.t:0 "Идеологическое господство"
 mk_global.72.d:0 "Одна идеология охватила почти половину Казуалии. Идеологический финал."
 mk_global.72.a:0 "Идея победила"
 mk_global.73.t:0 "Политический кризис Поворота"
 mk_global.73.d:0 "После Великого Поворота страна шатается между скандалом и экономическим ударом."
 mk_global.73.a:0 "Скандал"
 mk_global.73.b:0 "Тряска рынков"
 mk_plot.1.t:0 "Трещины Перелома"
 mk_plot.1.d:0 "Через месяц после старта «Эпохи» дипломаты замечают одно и то же: карты вранья, протоколы пустые, а шкала Абсурда ползёт вверх сама."
 mk_plot.1.a:0 "Мир уже другой"
 mk_plot.2.t:0 "Доклад о Переломе"
 mk_plot.2.d:0 "Внутренний отчёт: старые правила Казуалии больше не держат. Нужны либо голоса, либо сила."
 mk_plot.2.a:0 "Собрать голоса"
 mk_plot.2.b:0 "Сохранить видимость порядка"
 mk_plot.3.t:0 "Поворот требует масок"
 mk_plot.3.d:0 "Великий Политический Поворот не просто открыл ветки. Он потребовал, чтобы правители назвали себя заново — и переименовали страны."
 mk_plot.3.a:0 "Личности тоже эволюционируют"
 mk_plot.4.t:0 "Выбор лица эпохи"
 mk_plot.4.d:0 "Народ ждёт не только курса, но и нового имени власти. Товарищ, вождь или президент — от этого зависит и флаг над столицей."
 mk_plot.4.a:0 "Жёсткий тон"
 mk_plot.4.b:0 "Осторожный тон"
 mk_plot.4.c:0 "Подключить ячейки НПТ"
 mk_plot.5.t:0 "Карта блоков"
 mk_plot.5.d:0 "Идеологические альянсы перестают быть клубами по интересам. Теперь это линии фронта на дипломатической карте."
 mk_plot.5.a:0 "Выбирать сторону"
 mk_plot.6.t:0 "Войны с оправданиями"
 mk_plot.6.d:0 "В Казуалии больше не воюют «просто так». Воюют за ревизионизм, за интеграцию, за код и за обиду. Поводы плодятся быстрее дивизий."
 mk_plot.6.a:0 "История любит casus belli"
 mk_plot.7.t:0 "Повод на столе"
 mk_plot.7.d:0 "Генштаб и МИД одновременно кладут на стол один и тот же документ: основание для войны с соседом. Решение — политическое."
 mk_plot.7.a:0 "Принять повод"
 mk_plot.7.b:0 "Отложить войну"
 mk_plot.8.t:0 "НПТ выходит из тени"
 mk_plot.8.d:0 "Национал-Программисты Татарстана больше не притворяются стартапом. Это культ кода — и он служит только фашистским режимам Казуалии."
 mk_plot.8.a:0 "Компиляция идеологии"
 mk_plot.9.t:0 "Приглашение в Протокол"
 mk_plot.9.d:0 "Ячейки НПТ предлагают вашей державе полный доступ к протоколу. Цена — верность чёрно-красному коду."
 mk_plot.9.a:0 "Принять протокол"
 mk_plot.9.b:0 "Взять силу без ярлыка"
 mk_plot.10.t:0 "Тревога о НПТ"
 mk_plot.10.d:0 "Разведка докладывает: НПТ укрепляется только в фашистских государствах. Остальным остаётся либо бояться, либо готовить ответ."
 mk_plot.10.a:0 "Готовить контрмеры"
 mk_plot.10.b:0 "Попытаться договориться"
 mk_flavor.1.t:0 "Блок собран за час"
 mk_flavor.1.d:0 "Едва альянс объявлен — телеграммы летят ко всем единомышленникам. В Казуалии идеология сама собирает фракцию."
 mk_flavor.1.a:0 "Двери открыты"
 mk_flavor.2.t:0 "Сырьевой сюрприз"
 mk_flavor.2.d:0 "Геологи (или просто удачливые чиновники) докладывают о новых залежах. Карта ресурсов снова врёт — в вашу пользу."
 mk_flavor.2.a:0 "Копать глубже"
 mk_flavor.2.b:0 "Раздуть новость"
 mk_flavor.3.t:0 "Учения у границы"
 mk_flavor.3.d:0 "Генштаб предлагает «мирные» манёвры. Соседи уже нервничают."
 mk_flavor.3.a:0 "Тренировать армию"
 mk_flavor.3.b:0 "Набрать резерв"
 mk_flavor.3.c:0 "Сразу найти повод"
 mk_flavor.4.t:0 "Клуб единомышленников"
 mk_flavor.4.d:0 "Дипломаты предлагают либо согреть отношения, либо сразу сколотить блок."
 mk_flavor.4.a:0 "Укрепить связи"
 mk_flavor.4.b:0 "Создать альянс"
 mk_flavor.5.t:0 "Торг на Конгрессе"
 mk_flavor.5.d:0 "Голос можно купить, выпросить или просто громко потребовать."
 mk_flavor.5.a:0 "Купить голос"
 mk_flavor.5.b:0 "Играть на абсурде"
 mk_flavor.6.t:0 "Карта ресурсов оживает"
 mk_flavor.6.d:0 "По Казуалии разъехались геологические партии. Сталь, нефть и каучук больше не «везде поровну»."
 mk_flavor.6.a:0 "Мир стал тяжелее"
 mk_flavor.7.t:0 "Уличный жар"
 mk_flavor.7.d:0 "Механика страны зашкаливает — улицы шумят, кабинеты спорят."
 mk_flavor.7.a:0 "Обратить в военный пыл"
 mk_flavor.7.b:0 "Заткнуть золотом"
 mk_flavor.8.t:0 "Промышленный импульс"
 mk_flavor.8.d:0 "Либо новый завод, либо новая скважина. Выбор эпохи."
 mk_flavor.8.a:0 "Строить завод"
 mk_flavor.8.b:0 "Копать ресурсы"
