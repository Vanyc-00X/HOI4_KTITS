 mk_cre.2.d:0 "Хасанов принимает клятву реванша на центральной площади."
 mk_cre.2.a:0 "Вперёд, без оглядки"
 mk_cre.2.b:0 "Вплести код НПТ в курс"
 mk_cre.3.t:0 "Генералы у власти"
 mk_cre.3.d:0 "Хасанов распускает партию и надевает генеральские погоны."
 mk_cre.3.a:0 "Вперёд, без оглядки"
 mk_cre.3.b:0 "Тихая стабилизация"
 mk_cre.4.t:0 "Ветераны голосуют"
 mk_cre.4.d:0 "Ветераны выходят на марш — на этот раз к избирательным участкам."
 mk_cre.4.a:0 "Вперёд, без оглядки"
 mk_cre.4.b:0 "Международные наблюдатели"
 mk_cre.5.t:0 "Цвет сменился"
 mk_cre.5.d:0 "Хасанов объявляет, что настоящий враг — капитал. Знамёна перекрашивают за ночь."
 mk_cre.5.a:0 "Вперёд, без оглядки"
 mk_cre.5.b:0 "Экспорт лозунгов соседям"
 mk_cre.6.t:0 "Счёт предъявлен"
 mk_cre.6.d:0 "Хасанов зачитывает список обид. Список длиной в три часа."
 mk_cre.6.a:0 "Открыть тайну миру"
 mk_cre.6.b:0 "Засекретить всё"
 mk_cre.7.t:0 "Удар готов"
 mk_cre.7.d:0 "Генштаб докладывает: армия готова к наступлению в любой момент."
 mk_cre.7.a:0 "Выжать максимум"
 mk_cre.7.b:0 "Распределить выгоды"
 mk_cre.7.c:0 "Купить голос на Конгрессе"
 mk_cre.8.t:0 "Уклонисты"
 mk_cre.8.d:0 "Повестки возвращаются нераспечатанными. Реваншисты в ярости."
 mk_cre.8.a:0 "Чрезвычайные меры"
 mk_cre.8.b:0 "Купить лояльность"
 mk_cre.8.c:0 "Свалить вину на соседей"
 mk_cre.9.t:0 "Экономика на пределе"
 mk_cre.9.d:0 "Заводы делают только снаряды. В магазинах пусто."
 mk_cre.9.a:0 "Использовать подъём"
 mk_cre.9.b:0 "Сбросить напряжение"
 mk_cre.9.c:0 "Объявить исторический момент"
 mk_cre.10.t:0 "Арсенал реванша"
 mk_cre.10.d:0 "Склады Республики забиты оружием до потолка."
 mk_cre.10.a:0 "Новые заводы"
 mk_cre.10.b:0 "Инженерные бюро"
 mk_cre.10.c:0 "Военный заказ"
 mk_cre.11.t:0 "Армия реванша"
 mk_cre.11.d:0 "Парад ударных армий длился шесть часов."
 mk_cre.11.a:0 "Подготовить повод к войне"
 mk_cre.11.b:0 "Только оборона"
 mk_cre.11.c:0 "Показательные манёвры"
 mk_cre.12.t:0 "Ось реванша"
 mk_cre.12.d:0 "Послы Республики нашли тех, у кого тоже есть обиды."
 mk_cre.12.a:0 "Голос на Конгрессе"
 mk_cre.12.b:0 "Друзья по всей Казуалии"
 mk_cre.12.c:0 "Сколотить идеологический блок"
 mk_cre.13.t:0 "Тотальный реванш"
 mk_cre.13.d:0 "Чёрная Республика объявила тотальный реванш. Соседи проверяют свои укрепления."
 mk_cre.13.a:0 "Реванш неизбежен"
 mk_cre.14.t:0 "Новый союзник"
 mk_cre.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_cre.14.a:0 "Укрепить договор"
 mk_cre.14.b:0 "Сразу требовать большего"
 mk_cre.15.t:0 "Слух из кабинетов"
 mk_cre.15.d:0 "В коридорах Чёрная Республика шепчутся о новом курсе. Народ ждёт сигнала."
 mk_cre.15.a:0 "Разогнать слух"
 mk_cre.15.b:0 "Официально опровергнуть"
 mk_cre.15.c:0 "Подлить масла"
 mk_cre.16.t:0 "Повод на столе генштаба"
 mk_cre.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_cre.16.a:0 "Жёсткий ультиматум"
 mk_cre.16.b:0 "Тихая подготовка"
 mk_cre.16.c:0 "Отложить"
 mk_cre.17.t:0 "Тихий торг эпохи"
 mk_cre.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_cre.17.a:0 "Принять сделку"
 mk_cre.17.b:0 "Торговаться жёстче"
 mk_cre.17.c:0 "Отказаться"
 mk_cre.18.t:0 "Утечка из секретного архива"
 mk_cre.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_cre.18.a:0 "Засекретить обратно"
 mk_cre.18.b:0 "Опубликовать выборочно"
 mk_cre.18.c:0 "Обвинить соседей"
 mk_cre.19.t:0 "Идеологический саммит"
 mk_cre.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_cre.19.a:0 "Сколотить альянс сейчас"
 mk_cre.19.b:0 "Сначала мнения"
 mk_cre.19.c:0 "Только протокол"
