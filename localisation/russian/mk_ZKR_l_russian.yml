 ZKR_dec_campaign_c:0 "Кампания: Народная Закария"
 ZKR_dec_campaign_c_desc:0 "Мобилизовать сторонников курса «Народная Закария»."
 mk_zkr.1.t:0 "Курс Закирова"
 mk_zkr.1.d:0 "Закиров Ильнар Алмазович: «Рынок, порядок, дипломатия — в этом порядке»."
 mk_zkr.1.a:0 "Ставка на «Контрактная экономика»"
 mk_zkr.1.b:0 "Созвать парламент"
 mk_zkr.2.t:0 "Курс сохранён"
 mk_zkr.2.d:0 "Закиров подписывает закон о неприкосновенности контрактов."
 mk_zkr.2.a:0 "Вперёд, без оглядки"
 mk_zkr.2.b:0 "Международные наблюдатели"
 mk_zkr.3.t:0 "Директора у власти"
 mk_zkr.3.d:0 "Закиров распускает кабинет и назначает министрами глав корпораций."
 mk_zkr.3.a:0 "Вперёд, без оглядки"
 mk_zkr.3.b:0 "Тихая стабилизация"
 mk_zkr.4.t:0 "Время порядка"
 mk_zkr.4.d:0 "Закиров вводит чрезвычайное положение. Тендеры отменены."
 mk_zkr.4.a:0 "Вперёд, без оглядки"
 mk_zkr.4.b:0 "Вплести код НПТ в курс"
 mk_zkr.5.t:0 "Конец контрактов"
 mk_zkr.5.d:0 "Закиров национализирует подрядчиков. Бизнес в шоке."
 mk_zkr.5.a:0 "Вперёд, без оглядки"
 mk_zkr.5.b:0 "Экспорт лозунгов соседям"
 mk_zkr.6.t:0 "IPO государства"
 mk_zkr.6.d:0 "Закиров предлагает выпустить акции Республики."
 mk_zkr.6.a:0 "Открыть тайну миру"
 mk_zkr.6.b:0 "Засекретить всё"
 mk_zkr.7.t:0 "Мегаконтракт"
 mk_zkr.7.d:0 "Подписан контракт на новый завод. Сроки — гарантированы."
 mk_zkr.7.a:0 "Выжать максимум"
 mk_zkr.7.b:0 "Распределить выгоды"
 mk_zkr.7.c:0 "Купить голос на Конгрессе"
 mk_zkr.8.t:0 "Контракты сорваны"
 mk_zkr.8.d:0 "Подрядчики разорились. Стройки заморожены."
 mk_zkr.8.a:0 "Чрезвычайные меры"
 mk_zkr.8.b:0 "Купить лояльность"
 mk_zkr.8.c:0 "Свалить вину на соседей"
 mk_zkr.9.t:0 "Пузырь контрактов"
 mk_zkr.9.d:0 "Контрактов больше, чем строителей. Экономисты тревожатся."
 mk_zkr.9.a:0 "Использовать подъём"
 mk_zkr.9.b:0 "Сбросить напряжение"
 mk_zkr.9.c:0 "Объявить исторический момент"
 mk_zkr.10.t:0 "Экономика контрактов"
 mk_zkr.10.d:0 "Закария — главная стройплощадка Казуалии."
 mk_zkr.10.a:0 "Новые заводы"
 mk_zkr.10.b:0 "Инженерные бюро"
 mk_zkr.10.c:0 "Военный заказ"
 mk_zkr.11.t:0 "Армия порядка"
 mk_zkr.11.d:0 "Армия получила новое оружие точно в срок."
 mk_zkr.11.a:0 "Подготовить повод к войне"
 mk_zkr.11.b:0 "Только оборона"
 mk_zkr.11.c:0 "Показательные манёвры"
 mk_zkr.12.t:0 "Деловые союзы"
 mk_zkr.12.d:0 "Соседи подписывают с Закарией инвестиционные договоры."
 mk_zkr.12.a:0 "Голос на Конгрессе"
 mk_zkr.12.b:0 "Друзья по всей Казуалии"
 mk_zkr.12.c:0 "Сколотить идеологический блок"
 mk_zkr.13.t:0 "Корпорация Закария"
 mk_zkr.13.d:0 "Республика Закария провела первое в истории IPO государства. Акции раскупили за час."
 mk_zkr.13.a:0 "Купить акции"
 mk_zkr.14.t:0 "Новый союзник"
 mk_zkr.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_zkr.14.a:0 "Укрепить договор"
 mk_zkr.14.b:0 "Сразу требовать большего"
 mk_zkr.15.t:0 "Слух из кабинетов"
 mk_zkr.15.d:0 "В коридорах Республика Закария шепчутся о новом курсе. Народ ждёт сигнала."
 mk_zkr.15.a:0 "Разогнать слух"
 mk_zkr.15.b:0 "Официально опровергнуть"
 mk_zkr.15.c:0 "Подлить масла"
 mk_zkr.16.t:0 "Повод на столе генштаба"
 mk_zkr.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_zkr.16.a:0 "Жёсткий ультиматум"
 mk_zkr.16.b:0 "Тихая подготовка"
 mk_zkr.16.c:0 "Отложить"
 mk_zkr.17.t:0 "Тихий торг эпохи"
 mk_zkr.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_zkr.17.a:0 "Принять сделку"
 mk_zkr.17.b:0 "Торговаться жёстче"
 mk_zkr.17.c:0 "Отказаться"
 mk_zkr.18.t:0 "Утечка из секретного архива"
 mk_zkr.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_zkr.18.a:0 "Засекретить обратно"
 mk_zkr.18.b:0 "Опубликовать выборочно"
 mk_zkr.18.c:0 "Обвинить соседей"
 mk_zkr.19.t:0 "Идеологический саммит"
 mk_zkr.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_zkr.19.a:0 "Сколотить альянс сейчас"
 mk_zkr.19.b:0 "Сначала мнения"
 mk_zkr.19.c:0 "Только протокол"
