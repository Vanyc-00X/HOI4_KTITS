l_russian:
 mk_remilitarize_rhineland:0 "Ремилитаризация Рейнской области"
 mk_remilitarize_rhineland_desc:0 "Снять демилитаризацию с Рейнланда и вернуть войска к западной границе."
 mk_remilitarize_bosporus:0 "Ремилитаризация проливов"
 mk_remilitarize_bosporus_desc:0 "Вернуть полный контроль над Стамбулом и проливами — конец внешней опеки."
 mk_remilitarize_danzig:0 "Ремилитаризация Данцига"
 mk_remilitarize_danzig_desc:0 "Снять особый статус Данцига и укрепить город как обычную провинцию."
 CRE_he_is_back:0 "Он снова здесь"
 CRE_he_is_back_desc:0 "Из руин казуальной истории поднимается знакомая тень. Адольф Гитлер возвращается — на этот раз как советник Чёрной Республики."
 CRE_he_is_back_tt:0 "§YАдольф Гитлер§! — политический советник.\n§YВанильный Фюрер:§! +10% PP, +0.1% WS/нед от потерь, +20% желаемых дивизий ИИ, +5% сопротивление, -2% комплаенс.\n§Y+20%§! исследование танков и пехотного снаряжения.\n§Y+20%§! скорость военных заводов.\n§Y+20%§! атака пехоты / артиллерии / бронетехники, §Y+15%§! защита всем войскам.\n(Без векселей Мефо.)"
 CRE_blitz_renaissance:0 "Ренессанс блицкрига"
 CRE_blitz_renaissance_desc:0 "Под наставничеством Фюрера бронетанковые силы и моторизация получают новый импульс."
 CRE_total_mobilization:0 "Тотальная мобилизация"
 CRE_total_mobilization_desc:0 "Вся промышленность — на войну. Новые военные заводы и жёсткая мобилизация населения."
 CRE_new_order:0 "Новый порядок"
 CRE_new_order_desc:0 "Казуальный мир должен быть перекован. Соседи узнают, что значит вернувшийся Фюрер."
 CRE_army_reforged:0 "Перековка армии"
 CRE_army_reforged_desc:0 "Доктрины, обучение и штабы — всё под единый стандарт Феникса."
 CRE_steel_legions:0 "Стальные легионы"
 CRE_steel_legions_desc:0 "Пехота становится ударным ядром новой войны."
 CRE_phoenix_labs:0 "Лаборатории Феникса"
 CRE_phoenix_labs_desc:0 "Новый исследовательский слот и рывок в авиации и электронике."
 CRE_secret_weapons:0 "Оружие возмездия"
 CRE_secret_weapons_desc:0 "Ракеты, артсистемы и секретные проекты — без жалости к срокам."
 CRE_phoenix_ideology:0 "Феникс Великой Идеологии"
 CRE_phoenix_ideology_desc:0 "Чёрная Республика сгорает и возрождается под новым именем."
 CRE_phoenix_ideology_tt:0 "Страна переименовывается в §YФеникс Великой Идеологии§!"
 CRE_advisor_iron_marshal:0 "Виктор Баринов"
 CRE_advisor_iron_marshal_desc:0 "Назначить Виктора Баринова главой армии."
 CRE_advisor_iron_marshal_tt:0 "Открывает советника §YВиктор Баринов§! (глава армии)."
 CRE_advisor_war_scientist:0 "Военный учёный"
 CRE_advisor_war_scientist_desc:0 "Теоретик доктрин и ускорения опыта армии."
 CRE_advisor_war_scientist_tt:0 "Открывает советника §YВоенный учёный§! (теоретик): дешевле доктрины, опыт, наука."
 CRE_advisor_voice_of_reich:0 "Николай Петрович"
 CRE_advisor_voice_of_reich_desc:0 "Привлечь Николая Петровича в правительство."
 CRE_advisor_voice_of_reich_tt:0 "Открывает советника §YНиколай Петрович§! (политический советник)."
 CRE_advisor_sky_hunter:0 "Охотник небес"
 CRE_advisor_sky_hunter_desc:0 "Глава ВВС — превосходство в воздухе и асы."
 CRE_advisor_sky_hunter_tt:0 "Открывает советника §YОхотник небес§! (глава ВВС): air superiority, асы, атака авиации."
 CRE_finish_the_job:0 "Закончить начатое"
 CRE_finish_the_job_desc:0 "Война против Красной Земли, Чёрной Тартарии и Казачьих Штатов — до конца."
 CRE_finish_the_job_tt:0 "Цели войны (аннексия) против §YКрасной Земли (KRZ)§!, §YЧёрной Тартарии (BTR)§! и §YКазачьих Штатов (KZS)§!."
 CRE_idea_fuhrer_research:0 "Совет Фюрера"
 CRE_idea_fuhrer_research_desc:0 "Гитлер направляет военную промышленность и исследования."
 CRE_idea_blitz_spirit:0 "Дух блицкрига"
 CRE_idea_blitz_spirit_desc:0 "Скорость и ударная мощь бронетехники."
 CRE_idea_total_mobilization:0 "Тотальная мобилизация"
 CRE_idea_total_mobilization_desc:0 "Экономика и призыв подчинены войне."
 CRE_idea_new_order:0 "Новый порядок"
 CRE_idea_new_order_desc:0 "Агрессивная внешняя политика Чёрной Республики."
 CRE_idea_army_reforged:0 "Перекованная армия"
 CRE_idea_army_reforged_desc:0 "Быстрее обучение и восстановление организации."
 CRE_idea_steel_legions:0 "Стальные легионы"
 CRE_idea_steel_legions_desc:0 "Усиленная пехота и прорыв."
 CRE_idea_phoenix_labs:0 "Лаборатории Феникса"
