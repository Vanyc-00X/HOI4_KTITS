 mk_gen_kazual_course:0 "Казуальный курс"
 mk_gen_kazual_course_desc:0 "Мир сошёл с ума. Пора выбрать, как в нём выживать."
 mk_gen_world_voice:0 "Голос в мировом хоре"
 mk_gen_world_voice_desc:0 "Каждый из 24 Голосов Мира что-то значит. Наш должен звучать громче."
 mk_gen_congress_delegation:0 "Делегация на Конгресс"
