 mk_nbl.9.c:0 "Объявить исторический момент"
 mk_nbl.10.t:0 "Индустриальная держава"
 mk_nbl.10.d:0 "Булатия вошла в тройку промышленных лидеров Казуалии."
 mk_nbl.10.a:0 "Новые заводы"
 mk_nbl.10.b:0 "Инженерные бюро"
 mk_nbl.10.c:0 "Военный заказ"
 mk_nbl.11.t:0 "Армия будущего"
 mk_nbl.11.d:0 "Новая армия Булатии оснащена по последнему слову техники."
 mk_nbl.11.a:0 "Подготовить повод к войне"
 mk_nbl.11.b:0 "Только оборона"
 mk_nbl.11.c:0 "Показательные манёвры"
 mk_nbl.12.t:0 "Союз модернизации"
 mk_nbl.12.d:0 "Соседи приглашают строителей Булатии к себе."
 mk_nbl.12.a:0 "Голос на Конгрессе"
 mk_nbl.12.b:0 "Друзья по всей Казуалии"
 mk_nbl.12.c:0 "Сколотить идеологический блок"
 mk_nbl.13.t:0 "Булатия-2050"
 mk_nbl.13.d:0 "Новая Булатия начала строить город будущего. Соседи присылают делегации посмотреть."
 mk_nbl.13.a:0 "Будущее — сегодня"
 mk_nbl.14.t:0 "Новый союзник"
 mk_nbl.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_nbl.14.a:0 "Укрепить договор"
 mk_nbl.14.b:0 "Сразу требовать большего"
 mk_nbl.15.t:0 "Слух из кабинетов"
 mk_nbl.15.d:0 "В коридорах Новая Булатия шепчутся о новом курсе. Народ ждёт сигнала."
 mk_nbl.15.a:0 "Разогнать слух"
 mk_nbl.15.b:0 "Официально опровергнуть"
 mk_nbl.15.c:0 "Подлить масла"
 mk_nbl.16.t:0 "Повод на столе генштаба"
 mk_nbl.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_nbl.16.a:0 "Жёсткий ультиматум"
 mk_nbl.16.b:0 "Тихая подготовка"
 mk_nbl.16.c:0 "Отложить"
 mk_nbl.17.t:0 "Тихий торг эпохи"
 mk_nbl.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_nbl.17.a:0 "Принять сделку"
 mk_nbl.17.b:0 "Торговаться жёстче"
 mk_nbl.17.c:0 "Отказаться"
 mk_nbl.18.t:0 "Утечка из секретного архива"
 mk_nbl.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_nbl.18.a:0 "Засекретить обратно"
 mk_nbl.18.b:0 "Опубликовать выборочно"
 mk_nbl.18.c:0 "Обвинить соседей"
 mk_nbl.19.t:0 "Идеологический саммит"
 mk_nbl.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_nbl.19.a:0 "Сколотить альянс сейчас"
 mk_nbl.19.b:0 "Сначала мнения"
 mk_nbl.19.c:0 "Только протокол"
