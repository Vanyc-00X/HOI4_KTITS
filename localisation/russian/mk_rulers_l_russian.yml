 mk_ruler.1.t:0 "Судьба правителя: император случайного масштаба"
 mk_ruler.1.d:0 "Император случайного масштаба потерял власть после падения VCI. Победитель может использовать его опыт: назначить его политическим советником или включить в Верховное командование. Его прежние таланты остаются сильными, но вместе с ними приходят прежние слабости."
 mk_ruler.1.a:0 "Назначить политическим советником"
 mk_ruler.1.b:0 "Назначить в Верховное командование"
