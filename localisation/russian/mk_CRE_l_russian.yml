 CRE_adolf_hitler_guest_instructor:0 "Адольф Гитлер (приглашённый инструктор)"
 CRE_adolf_hitler_guest_instructor_desc:0 "Спорный иностранный инструктор; его курс по стратегической самоизоляции включён в штабную программу как предостережение."
 CRE_hermann_goering_guest_instructor:0 "Герман Геринг (приглашённый инструктор)"
 CRE_hermann_goering_guest_instructor_desc:0 "Гость военной миссии, обещавший авиацию в смете и оставивший штаб разбираться с мелким шрифтом."
 CRE_erwin_rommel_guest_instructor:0 "Эрвин Роммель (приглашённый инструктор)"
 CRE_erwin_rommel_guest_instructor_desc:0 "Иностранный инструктор по манёврам; его карта оказалась точнее, чем местный компас."
 CRE_heinz_guderian_guest_instructor:0 "Хайнц Гудериан (приглашённый инструктор)"
 CRE_heinz_guderian_guest_instructor_desc:0 "Иностранный инструктор по подвижным соединениям, которому выдали карту без масштаба."
