 mk_zns.1.d:0 "Зайнутдинов Артур Равилевич разворачивает карту: «Здесь будут дороги. Везде»."
 mk_zns.1.a:0 "Ставка на «Интеграционные очки»"
 mk_zns.1.b:0 "Укрепить аппарат"
 mk_zns.2.t:0 "Семья регионов"
 mk_zns.2.d:0 "Зайнутдинов подписывает союзный договор с губернаторами."
 mk_zns.2.a:0 "Вперёд, без оглядки"
 mk_zns.2.b:0 "Тихая стабилизация"
 mk_zns.3.t:0 "Парламент Союза"
 mk_zns.3.d:0 "Зайнутдинов открывает союзный парламент."
 mk_zns.3.a:0 "Вперёд, без оглядки"
 mk_zns.3.b:0 "Международные наблюдатели"
 mk_zns.4.t:0 "Железная рука"
 mk_zns.4.d:0 "Зайнутдинов назначает наместников во все регионы."
 mk_zns.4.a:0 "Вперёд, без оглядки"
 mk_zns.4.b:0 "Вплести код НПТ в курс"
 mk_zns.5.t:0 "Советы регионов"
 mk_zns.5.d:0 "Зайнутдинов передаёт власть советам трудовых регионов."
 mk_zns.5.a:0 "Вперёд, без оглядки"
 mk_zns.5.b:0 "Экспорт лозунгов соседям"
 mk_zns.6.t:0 "Провозглашение Великого Союза"
 mk_zns.6.d:0 "Зайнутдинов провозглашает Великий Союз всех регионов Казуалии."
 mk_zns.6.a:0 "Открыть тайну миру"
 mk_zns.6.b:0 "Засекретить всё"
 mk_zns.7.t:0 "Регион вступает"
 mk_zns.7.d:0 "Пограничная область соседа проголосовала за вступление в Союз."
 mk_zns.7.a:0 "Выжать максимум"
 mk_zns.7.b:0 "Распределить выгоды"
 mk_zns.7.c:0 "Купить голос на Конгрессе"
 mk_zns.8.t:0 "Регионы разбегаются"
 mk_zns.8.d:0 "Губернаторы игнорируют союзные указы."
 mk_zns.8.a:0 "Чрезвычайные меры"
 mk_zns.8.b:0 "Купить лояльность"
 mk_zns.8.c:0 "Свалить вину на соседей"
 mk_zns.9.t:0 "Соседи тревожатся"
 mk_zns.9.d:0 "Союзные трассы подходят к самым границам соседей. Соседи нервничают."
 mk_zns.9.a:0 "Использовать подъём"
 mk_zns.9.b:0 "Сбросить напряжение"
 mk_zns.9.c:0 "Объявить исторический момент"
 mk_zns.10.t:0 "Инфраструктура Союза"
 mk_zns.10.d:0 "Союзная трасса связала все регионы. Время в пути сократилось вдвое."
 mk_zns.10.a:0 "Новые заводы"
 mk_zns.10.b:0 "Инженерные бюро"
 mk_zns.10.c:0 "Военный заказ"
 mk_zns.11.t:0 "Армия на колёсах"
 mk_zns.11.d:0 "Армия Союза может оказаться у любой границы за сутки."
 mk_zns.11.a:0 "Подготовить повод к войне"
 mk_zns.11.b:0 "Только оборона"
 mk_zns.11.c:0 "Показательные манёвры"
 mk_zns.12.t:0 "Коридоры Союза"
 mk_zns.12.d:0 "Соседи подписывают соглашения о транзите через Союз."
 mk_zns.12.a:0 "Голос на Конгрессе"
 mk_zns.12.b:0 "Друзья по всей Казуалии"
 mk_zns.12.c:0 "Сколотить идеологический блок"
 mk_zns.13.t:0 "Великий Союз"
 mk_zns.13.d:0 "Зайнутдиновский Союз провозгласил себя Великим и пригласил в него все регионы Казуалии."
 mk_zns.13.a:0 "Все дороги — в Союз"
 mk_zns.14.t:0 "Новый союзник"
 mk_zns.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_zns.14.a:0 "Укрепить договор"
 mk_zns.14.b:0 "Сразу требовать большего"
 mk_zns.15.t:0 "Слух из кабинетов"
 mk_zns.15.d:0 "В коридорах Зайнутдиновский Союз шепчутся о новом курсе. Народ ждёт сигнала."
 mk_zns.15.a:0 "Разогнать слух"
 mk_zns.15.b:0 "Официально опровергнуть"
 mk_zns.15.c:0 "Подлить масла"
 mk_zns.16.t:0 "Повод на столе генштаба"
 mk_zns.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_zns.16.a:0 "Жёсткий ультиматум"
 mk_zns.16.b:0 "Тихая подготовка"
 mk_zns.16.c:0 "Отложить"
 mk_zns.17.t:0 "Тихий торг эпохи"
 mk_zns.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_zns.17.a:0 "Принять сделку"
 mk_zns.17.b:0 "Торговаться жёстче"
 mk_zns.17.c:0 "Отказаться"
 mk_zns.18.t:0 "Утечка из секретного архива"
 mk_zns.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_zns.18.a:0 "Засекретить обратно"
 mk_zns.18.b:0 "Опубликовать выборочно"
 mk_zns.18.c:0 "Обвинить соседей"
 mk_zns.19.t:0 "Идеологический саммит"
 mk_zns.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_zns.19.a:0 "Сколотить альянс сейчас"
 mk_zns.19.b:0 "Сначала мнения"
 mk_zns.19.c:0 "Только протокол"
