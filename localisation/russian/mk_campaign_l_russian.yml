l_russian:
 MK_CRISIS_BOOKMARK_NAME:0 "Кризис границ"
 MK_CRISIS_BOOKMARK_DESC:0 "1939 год. Пересмотр границ расколол континент на два фронта: VCI против ZLD и KRZ против BTR. Правительства меняются, а железные дороги превращаются в линии снабжения."
 MK_CRISIS_BOOKMARK_VCI_DESC:0 "После политического разворота Империя объявила войну Зеленодольску и присоединила спорный штат."
 MK_CRISIS_BOOKMARK_ZLD_DESC:0 "Потеря приграничной области и смена правительства поставили республику перед войной с Империей."
 mk_cat_border_crises_category:0 "Пограничные кризисы"
 mk_dec_border_crisis:0 "Обострить территориальный спор"
 mk_dec_border_crisis_desc:0 "Использовать высокий уровень абсурда, чтобы предъявить территориальные требования другой казуальной державе. Это создаст повод для войны."
 mk_tt_border_crisis:0 "Будет создан повод для войны с выбранной державой."
 mk_border_revision:0 "Пересмотр границ"
 mk_kazual_rifle:0 "Казуальная винтовка"
 mk_kazual_rifle_desc:0 "Модернизированная винтовка с улучшенной надёжностью и огневой мощью для пехоты."
 mk_kazual_rifle_equipment:0 "Казуальная винтовка"
 mk_kazual_rifle_equipment_desc:0 "Пехотная винтовка местного производства с улучшенными характеристиками."
 mk_kazual_assault_rifles:0 "Казуальный автомат"
 mk_kazual_assault_rifles_desc:0 "Компактное автоматическое оружие повышает плотность огня пехоты и эффективность прорыва."
 mk_kazual_assault_rifle_equipment:0 "Казуальный автомат"
 mk_kazual_assault_rifle_equipment_desc:0 "Автоматическое оружие нового поколения для линейной пехоты."
