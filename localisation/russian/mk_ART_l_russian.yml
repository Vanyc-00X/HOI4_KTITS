 mk_art.9.t:0 "Нацию не узнать"
 mk_art.9.d:0 "Регионы забыли старые обиды. Историки в растерянности."
 mk_art.9.a:0 "Использовать подъём"
 mk_art.9.b:0 "Сбросить напряжение"
 mk_art.9.c:0 "Объявить исторический момент"
 mk_art.10.t:0 "Экономика нации"
 mk_art.10.d:0 "Общий рынок регионов приносит первые плоды."
 mk_art.10.a:0 "Новые заводы"
 mk_art.10.b:0 "Инженерные бюро"
 mk_art.10.c:0 "Военный заказ"
 mk_art.11.t:0 "Армия единства"
 mk_art.11.d:0 "Полки из разных регионов маршируют вместе — и в ногу."
 mk_art.11.a:0 "Подготовить повод к войне"
 mk_art.11.b:0 "Только оборона"
 mk_art.11.c:0 "Показательные манёвры"
 mk_art.12.t:0 "Признание"
 mk_art.12.d:0 "Соседи признают Республику и открывают посольства."
 mk_art.12.a:0 "Голос на Конгрессе"
 mk_art.12.b:0 "Друзья по всей Казуалии"
 mk_art.12.c:0 "Сколотить идеологический блок"
 mk_art.13.t:0 "Единая нация"
 mk_art.13.d:0 "Айратская Республика предложила своё гражданство жителям всей Казуалии."
 mk_art.13.a:0 "Нация открыта"
 mk_art.14.t:0 "Новый союзник"
 mk_art.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_art.14.a:0 "Укрепить договор"
 mk_art.14.b:0 "Сразу требовать большего"
 mk_art.15.t:0 "Слух из кабинетов"
 mk_art.15.d:0 "В коридорах Айратская Республика шепчутся о новом курсе. Народ ждёт сигнала."
 mk_art.15.a:0 "Разогнать слух"
 mk_art.15.b:0 "Официально опровергнуть"
 mk_art.15.c:0 "Подлить масла"
 mk_art.16.t:0 "Повод на столе генштаба"
 mk_art.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_art.16.a:0 "Жёсткий ультиматум"
 mk_art.16.b:0 "Тихая подготовка"
 mk_art.16.c:0 "Отложить"
 mk_art.17.t:0 "Тихий торг эпохи"
 mk_art.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_art.17.a:0 "Принять сделку"
 mk_art.17.b:0 "Торговаться жёстче"
 mk_art.17.c:0 "Отказаться"
 mk_art.18.t:0 "Утечка из секретного архива"
 mk_art.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_art.18.a:0 "Засекретить обратно"
 mk_art.18.b:0 "Опубликовать выборочно"
 mk_art.18.c:0 "Обвинить соседей"
 mk_art.19.t:0 "Идеологический саммит"
 mk_art.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_art.19.a:0 "Сколотить альянс сейчас"
 mk_art.19.b:0 "Сначала мнения"
 mk_art.19.c:0 "Только протокол"
