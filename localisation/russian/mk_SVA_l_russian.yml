 mk_cat_SVA:0 "Научные советы ↔ парламент"
 mk_cat_SVA_desc:0 "Ассамблея делит власть между парламентом (0) и научными советами (100). Советы ускоряют науку, парламент — торговлю и стабильность.\n\n§YНаучные советы ↔ парламент:§! [?mk_mech|0] / 100"
