 ZML_dec_campaign_b:0 "Кампания: Народный вождь"
 ZML_dec_campaign_b_desc:0 "Мобилизовать сторонников курса «Народный вождь»."
 ZML_dec_campaign_c:0 "Кампания: Земская автономия"
 ZML_dec_campaign_c_desc:0 "Мобилизовать сторонников курса «Земская автономия»."
 mk_zml.1.t:0 "Великий сход"
 mk_zml.1.d:0 "Замалиев Руслан Айратович выступает на сходе. Слушают тысячи, спорят — все."
 mk_zml.1.a:0 "Ставка на «Коммунальный торг»"
 mk_zml.1.b:0 "Собрать советы на площадях"
 mk_zml.2.t:0 "Сход решил"
 mk_zml.2.d:0 "Сход общин поддержал Замалиева. Единогласно — почти."
 mk_zml.2.a:0 "Вперёд, без оглядки"
 mk_zml.2.b:0 "Экспорт лозунгов соседям"
 mk_zml.3.t:0 "Выборы общин"
 mk_zml.3.d:0 "Общины впервые выбирают депутатов в общий парламент."
 mk_zml.3.a:0 "Вперёд, без оглядки"
 mk_zml.3.b:0 "Международные наблюдатели"
 mk_zml.4.t:0 "Вождь выбран"
 mk_zml.4.d:0 "Сход провозглашает Замалиева народным вождём."
 mk_zml.4.a:0 "Вперёд, без оглядки"
 mk_zml.4.b:0 "Вплести код НПТ в курс"
 mk_zml.5.t:0 "Центр уступил"
 mk_zml.5.d:0 "Замалиев передаёт почти все полномочия землям."
 mk_zml.5.a:0 "Вперёд, без оглядки"
 mk_zml.5.b:0 "Тихая стабилизация"
 mk_zml.6.t:0 "Центр упразднён"
 mk_zml.6.d:0 "Сход голосует за упразднение центра. Замалиев голосует за."
 mk_zml.6.a:0 "Открыть тайну миру"
 mk_zml.6.b:0 "Засекретить всё"
 mk_zml.7.t:0 "Народный сход"
 mk_zml.7.d:0 "Массовый сход поддержал все решения правительства."
 mk_zml.7.a:0 "Выжать максимум"
 mk_zml.7.b:0 "Распределить выгоды"
 mk_zml.7.c:0 "Купить голос на Конгрессе"
 mk_zml.8.t:0 "Общины бойкотируют"
 mk_zml.8.d:0 "Общины отказываются платить налоги центру."
 mk_zml.8.a:0 "Чрезвычайные меры"
 mk_zml.8.b:0 "Купить лояльность"
 mk_zml.8.c:0 "Свалить вину на соседей"
 mk_zml.9.t:0 "Центр не нужен"
 mk_zml.9.d:0 "Общины так довольны, что спрашивают, зачем вообще нужна столица."
 mk_zml.9.a:0 "Использовать подъём"
 mk_zml.9.b:0 "Сбросить напряжение"
 mk_zml.9.c:0 "Объявить исторический момент"
 mk_zml.10.t:0 "Изобилие общин"
 mk_zml.10.d:0 "Артели собрали рекордный урожай."
 mk_zml.10.a:0 "Новые заводы"
 mk_zml.10.b:0 "Инженерные бюро"
 mk_zml.10.c:0 "Военный заказ"
 mk_zml.11.t:0 "Народная армия"
 mk_zml.11.d:0 "Ополчение общин готово выйти по первому зову."
 mk_zml.11.a:0 "Подготовить повод к войне"
 mk_zml.11.b:0 "Только оборона"
 mk_zml.11.c:0 "Показательные манёвры"
 mk_zml.12.t:0 "Братство общин"
 mk_zml.12.d:0 "Народные движения соседей приезжают учиться у Замалии."
 mk_zml.12.a:0 "Голос на Конгрессе"
 mk_zml.12.b:0 "Друзья по всей Казуалии"
 mk_zml.12.c:0 "Сколотить идеологический блок"
 mk_zml.13.t:0 "Вся власть общинам"
 mk_zml.13.d:0 "Земля Замалия упразднила центральное правительство. Общины правят сами."
 mk_zml.13.a:0 "Власть — общинам!"
 mk_zml.14.t:0 "Новый союзник"
 mk_zml.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_zml.14.a:0 "Укрепить договор"
 mk_zml.14.b:0 "Сразу требовать большего"
 mk_zml.15.t:0 "Слух из кабинетов"
 mk_zml.15.d:0 "В коридорах Земля Замалия шепчутся о новом курсе. Народ ждёт сигнала."
 mk_zml.15.a:0 "Разогнать слух"
 mk_zml.15.b:0 "Официально опровергнуть"
 mk_zml.15.c:0 "Подлить масла"
 mk_zml.16.t:0 "Повод на столе генштаба"
 mk_zml.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_zml.16.a:0 "Жёсткий ультиматум"
 mk_zml.16.b:0 "Тихая подготовка"
 mk_zml.16.c:0 "Отложить"
 mk_zml.17.t:0 "Тихий торг эпохи"
 mk_zml.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_zml.17.a:0 "Принять сделку"
 mk_zml.17.b:0 "Торговаться жёстче"
 mk_zml.17.c:0 "Отказаться"
 mk_zml.18.t:0 "Утечка из секретного архива"
 mk_zml.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_zml.18.a:0 "Засекретить обратно"
 mk_zml.18.b:0 "Опубликовать выборочно"
 mk_zml.18.c:0 "Обвинить соседей"
 mk_zml.19.t:0 "Идеологический саммит"
 mk_zml.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_zml.19.a:0 "Сколотить альянс сейчас"
 mk_zml.19.b:0 "Сначала мнения"
 mk_zml.19.c:0 "Только протокол"
