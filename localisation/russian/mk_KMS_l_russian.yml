 mk_kms.1.t:0 "Программа Содружества"
 mk_kms.1.d:0 "Гилязов Камиль Ильдарович: «Наша сила — в наших друзьях»."
 mk_kms.1.a:0 "Ставка на «Сеть партнёров»"
 mk_kms.1.b:0 "Созвать парламент"
 mk_kms.2.t:0 "Открытые двери"
 mk_kms.2.d:0 "Гилязов подписывает закон о свободе торговли и социальных гарантиях."
 mk_kms.2.a:0 "Вперёд, без оглядки"
 mk_kms.2.b:0 "Международные наблюдатели"
 mk_kms.3.t:0 "Торговля прежде всего"
 mk_kms.3.d:0 "Гилязов назначает министрами купцов. Парламент уходит на каникулы."
 mk_kms.3.a:0 "Вперёд, без оглядки"
 mk_kms.3.b:0 "Тихая стабилизация"
 mk_kms.4.t:0 "Сеть товарищей"
 mk_kms.4.d:0 "Гилязов предлагает партнёрам стать братскими республиками."
 mk_kms.4.a:0 "Вперёд, без оглядки"
 mk_kms.4.b:0 "Экспорт лозунгов соседям"
 mk_kms.5.t:0 "Конец мягкой силы"
 mk_kms.5.d:0 "Гилязов объявляет: «Мягкая сила кончилась»."
 mk_kms.5.a:0 "Вперёд, без оглядки"
 mk_kms.5.b:0 "Вплести код НПТ в курс"
 mk_kms.6.t:0 "Хартия Содружества"
 mk_kms.6.d:0 "Гилязов предлагает партнёрам подписать хартию единого Содружества."
 mk_kms.6.a:0 "Открыть тайну миру"
 mk_kms.6.b:0 "Засекретить всё"
 mk_kms.7.t:0 "Мягкая сила"
 mk_kms.7.d:0 "Студенты соседей учатся в Содружестве и возвращаются его друзьями."
 mk_kms.7.a:0 "Выжать максимум"
 mk_kms.7.b:0 "Распределить выгоды"
 mk_kms.7.c:0 "Купить голос на Конгрессе"
 mk_kms.8.t:0 "Партнёры уходят"
 mk_kms.8.d:0 "Ещё один партнёр разорвал торговое соглашение."
 mk_kms.8.a:0 "Чрезвычайные меры"
 mk_kms.8.b:0 "Купить лояльность"
 mk_kms.8.c:0 "Свалить вину на соседей"
 mk_kms.9.t:0 "Все хотят дружить"
 mk_kms.9.d:0 "Очередь партнёров на саммит растянулась на месяц."
 mk_kms.9.a:0 "Использовать подъём"
 mk_kms.9.b:0 "Сбросить напряжение"
 mk_kms.9.c:0 "Объявить исторический момент"
 mk_kms.10.t:0 "Торговая империя"
 mk_kms.10.d:0 "Товары Содружества продаются в каждой стране Казуалии."
 mk_kms.10.a:0 "Новые заводы"
 mk_kms.10.b:0 "Инженерные бюро"
 mk_kms.10.c:0 "Военный заказ"
 mk_kms.11.t:0 "Охрана путей"
 mk_kms.11.d:0 "Торговые пути Содружества стали самыми безопасными в Казуалии."
 mk_kms.11.a:0 "Подготовить повод к войне"
 mk_kms.11.b:0 "Только оборона"
 mk_kms.11.c:0 "Показательные манёвры"
 mk_kms.12.t:0 "Союзы Содружества"
 mk_kms.12.d:0 "Партнёры подписали договор о взаимной поддержке."
 mk_kms.12.a:0 "Голос на Конгрессе"
 mk_kms.12.b:0 "Друзья по всей Казуалии"
 mk_kms.12.c:0 "Сколотить идеологический блок"
 mk_kms.13.t:0 "Содружество Казуалии"
 mk_kms.13.d:0 "Камильское Содружество предложило всей Казуалии хартию единого Содружества."
 mk_kms.13.a:0 "Все мы партнёры"
 mk_kms.14.t:0 "Новый союзник"
 mk_kms.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_kms.14.a:0 "Укрепить договор"
 mk_kms.14.b:0 "Сразу требовать большего"
 mk_kms.15.t:0 "Слух из кабинетов"
 mk_kms.15.d:0 "В коридорах Камильское Содружество шепчутся о новом курсе. Народ ждёт сигнала."
 mk_kms.15.a:0 "Разогнать слух"
 mk_kms.15.b:0 "Официально опровергнуть"
 mk_kms.15.c:0 "Подлить масла"
 mk_kms.16.t:0 "Повод на столе генштаба"
 mk_kms.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_kms.16.a:0 "Жёсткий ультиматум"
 mk_kms.16.b:0 "Тихая подготовка"
 mk_kms.16.c:0 "Отложить"
 mk_kms.17.t:0 "Тихий торг эпохи"
 mk_kms.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_kms.17.a:0 "Принять сделку"
 mk_kms.17.b:0 "Торговаться жёстче"
 mk_kms.17.c:0 "Отказаться"
 mk_kms.18.t:0 "Утечка из секретного архива"
 mk_kms.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_kms.18.a:0 "Засекретить обратно"
 mk_kms.18.b:0 "Опубликовать выборочно"
 mk_kms.18.c:0 "Обвинить соседей"
 mk_kms.19.t:0 "Идеологический саммит"
 mk_kms.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
