 mk_hrl.10.c:0 "Военный заказ"
 mk_hrl.11.t:0 "Охрана трактов"
 mk_hrl.11.d:0 "Торговые тракты Лиги — самые безопасные в Казуалии."
 mk_hrl.11.a:0 "Подготовить повод к войне"
 mk_hrl.11.b:0 "Только оборона"
 mk_hrl.11.c:0 "Показательные манёвры"
 mk_hrl.12.t:0 "Новые партнёры"
 mk_hrl.12.d:0 "Соседи подают заявки на вступление в Лигу."
 mk_hrl.12.a:0 "Голос на Конгрессе"
 mk_hrl.12.b:0 "Друзья по всей Казуалии"
 mk_hrl.12.c:0 "Сколотить идеологический блок"
 mk_hrl.13.t:0 "Великая Лига"
 mk_hrl.13.d:0 "Харитоновская Лига предложила всей Казуалии вступить в единый торговый союз."
 mk_hrl.13.a:0 "Торговля объединяет"
 mk_hrl.14.t:0 "Новый союзник"
 mk_hrl.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_hrl.14.a:0 "Укрепить договор"
 mk_hrl.14.b:0 "Сразу требовать большего"
 mk_hrl.15.t:0 "Слух из кабинетов"
 mk_hrl.15.d:0 "В коридорах Харитоновская Лига шепчутся о новом курсе. Народ ждёт сигнала."
 mk_hrl.15.a:0 "Разогнать слух"
 mk_hrl.15.b:0 "Официально опровергнуть"
 mk_hrl.15.c:0 "Подлить масла"
 mk_hrl.16.t:0 "Повод на столе генштаба"
 mk_hrl.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_hrl.16.a:0 "Жёсткий ультиматум"
 mk_hrl.16.b:0 "Тихая подготовка"
 mk_hrl.16.c:0 "Отложить"
 mk_hrl.17.t:0 "Тихий торг эпохи"
 mk_hrl.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_hrl.17.a:0 "Принять сделку"
 mk_hrl.17.b:0 "Торговаться жёстче"
 mk_hrl.17.c:0 "Отказаться"
 mk_hrl.18.t:0 "Утечка из секретного архива"
 mk_hrl.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_hrl.18.a:0 "Засекретить обратно"
 mk_hrl.18.b:0 "Опубликовать выборочно"
 mk_hrl.18.c:0 "Обвинить соседей"
 mk_hrl.19.t:0 "Идеологический саммит"
 mk_hrl.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_hrl.19.a:0 "Сколотить альянс сейчас"
 mk_hrl.19.b:0 "Сначала мнения"
 mk_hrl.19.c:0 "Только протокол"
