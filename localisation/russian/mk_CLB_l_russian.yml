 mk_cat_CLB:0 "Технократический индекс"
 mk_cat_CLB_desc:0 "Челябой правят инженеры. Чем выше индекс, тем быстрее наука и заводы — и тем выше риск техногенной катастрофы.\n\n§YТехнократический индекс:§! [?mk_mech|0] / 100"
