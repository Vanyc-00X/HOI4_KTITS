 ZML_mech_down_tt:0 "Коммунальный торг §Rснижается§!"
 ZML_dec_raise:0 "Уступка общинам"
 ZML_dec_raise_desc:0 "Отдать общинам право распоряжаться налогами."
 ZML_dec_lower:0 "Власть центра"
 ZML_dec_lower_desc:0 "Напомнить общинам, где столица."
 ZML_dec_exploit:0 "Народный сход"
 ZML_dec_exploit_desc:0 "Массовый сход всех общин поддерживает правительство."
 ZML_dec_crisis:0 "Переговоры с общинами"
 ZML_dec_crisis_desc:0 "Замалиев лично едет на переговоры."
 ZML_dec_campaign_keep:0 "Кампания: Коммунальный популизм"
 ZML_dec_campaign_keep_desc:0 "Мобилизовать сторонников курса «Коммунальный популизм»."
