 mk_vci.1.t:0 "Эпоха начинается"
 mk_vci.1.d:0 "Сабиров Марат Айратович выходит на балкон дворца. Толпа ждёт указа. Указ ждёт вдохновения."
 mk_vci.1.a:0 "Ставка на «Индекс Казуальности»"
 mk_vci.1.b:0 "Укрепить аппарат"
 mk_vci.2.t:0 "Трон устоял"
 mk_vci.2.d:0 "Сабиров объявляет: никаких революций, кроме тех, что начнёт он сам."
 mk_vci.2.a:0 "Вперёд, без оглядки"
 mk_vci.2.b:0 "Тихая стабилизация"
 mk_vci.3.t:0 "Ультра-курс объявлен"
 mk_vci.3.d:0 "Тронная речь заканчивается маршем. Министры маршируют следом."
 mk_vci.3.a:0 "Вперёд, без оглядки"
 mk_vci.3.b:0 "Вплести код НПТ в курс"
 mk_vci.4.t:0 "Конституция дарована"
 mk_vci.4.d:0 "Сабиров лично подписывает конституцию — и первым её цитирует."
 mk_vci.4.a:0 "Вперёд, без оглядки"
 mk_vci.4.b:0 "Международные наблюдатели"
 mk_vci.5.t:0 "Император-пролетарий"
 mk_vci.5.d:0 "Сабиров снимает корону и надевает рабочую кепку. Корона, впрочем, рядом."
 mk_vci.5.a:0 "Вперёд, без оглядки"
 mk_vci.5.b:0 "Экспорт лозунгов соседям"
 mk_vci.6.t:0 "Сингулярность близко"
 mk_vci.6.d:0 "Придворные аналитики сообщают: Империя достигла предельной казуальности."
 mk_vci.6.a:0 "Открыть тайну миру"
 mk_vci.6.b:0 "Засекретить всё"
 mk_vci.7.t:0 "Казуальный рывок"
 mk_vci.7.d:0 "Накопленный азарт двора превращается в реальные полномочия."
 mk_vci.7.a:0 "Выжать максимум"
 mk_vci.7.b:0 "Распределить выгоды"
 mk_vci.7.c:0 "Купить голос на Конгрессе"
 mk_vci.8.t:0 "Империя заскучала"
 mk_vci.8.d:0 "Подданные жалуются: ничего не происходит уже целый месяц."
 mk_vci.8.a:0 "Чрезвычайные меры"
 mk_vci.8.b:0 "Купить лояльность"
 mk_vci.8.c:0 "Свалить вину на соседей"
 mk_vci.9.t:0 "Двор на грани"
 mk_vci.9.d:0 "Указы выходят быстрее, чем их успевают прочитать. Улица волнуется."
 mk_vci.9.a:0 "Использовать подъём"
 mk_vci.9.b:0 "Сбросить напряжение"
 mk_vci.9.c:0 "Объявить исторический момент"
 mk_vci.10.t:0 "Индустриальная Империя"
 mk_vci.10.d:0 "Новые фабрики названы в честь Императора. Все до единой."
 mk_vci.10.a:0 "Новые заводы"
 mk_vci.10.b:0 "Инженерные бюро"
 mk_vci.10.c:0 "Военный заказ"
 mk_vci.11.t:0 "Великая армия"
 mk_vci.11.d:0 "Генштаб докладывает: армия готова к любой задаче, которую придумает двор."
 mk_vci.11.a:0 "Подготовить повод к войне"
 mk_vci.11.b:0 "Только оборона"
 mk_vci.11.c:0 "Показательные манёвры"
 mk_vci.12.t:0 "Хозяин Конгресса"
 mk_vci.12.d:0 "Империя снова диктует повестку Всемирного Конгресса."
 mk_vci.12.a:0 "Голос на Конгрессе"
 mk_vci.12.b:0 "Друзья по всей Казуалии"
 mk_vci.12.c:0 "Сколотить идеологический блок"
 mk_vci.13.t:0 "Империя стала мемом"
 mk_vci.13.d:0 "Великая Казуальная Империя объявила себя «последним состоянием истории». Мир не понимает, но боится."
 mk_vci.13.a:0 "Это конец истории?"
 mk_vci.14.t:0 "Новый союзник"
 mk_vci.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_vci.14.a:0 "Укрепить договор"
 mk_vci.14.b:0 "Сразу требовать большего"
 mk_vci.15.t:0 "Слух из кабинетов"
 mk_vci.15.d:0 "В коридорах Великая Казуальная Империя шепчутся о новом курсе. Народ ждёт сигнала."
 mk_vci.15.a:0 "Разогнать слух"
 mk_vci.15.b:0 "Официально опровергнуть"
 mk_vci.15.c:0 "Подлить масла"
 mk_vci.16.t:0 "Повод на столе генштаба"
 mk_vci.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_vci.16.a:0 "Жёсткий ультиматум"
 mk_vci.16.b:0 "Тихая подготовка"
 mk_vci.16.c:0 "Отложить"
 mk_vci.17.t:0 "Тихий торг эпохи"
 mk_vci.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_vci.17.a:0 "Принять сделку"
 mk_vci.17.b:0 "Торговаться жёстче"
 mk_vci.17.c:0 "Отказаться"
 mk_vci.18.t:0 "Утечка из секретного архива"
 mk_vci.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_vci.18.a:0 "Засекретить обратно"
 mk_vci.18.b:0 "Опубликовать выборочно"
 mk_vci.18.c:0 "Обвинить соседей"
 mk_vci.19.t:0 "Идеологический саммит"
 mk_vci.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_vci.19.a:0 "Сколотить альянс сейчас"
 mk_vci.19.b:0 "Сначала мнения"
 mk_vci.19.c:0 "Только протокол"
