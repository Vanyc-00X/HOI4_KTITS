 mk_adl.1.t:0 "Курс центра"
 mk_adl.1.d:0 "Айдов Матвей обещает: «Айдалия будет дружить со всеми и не воевать ни с кем»."
 mk_adl.1.a:0 "Ставка на «Дипломатический баланс»"
 mk_adl.1.b:0 "Созвать парламент"
 mk_adl.2.t:0 "Центр устоял"
 mk_adl.2.d:0 "Айдов Матвей выступает с речью, с которой согласны все партии."
 mk_adl.2.a:0 "Вперёд, без оглядки"
 mk_adl.2.b:0 "Международные наблюдатели"
 mk_adl.3.t:0 "Нейтралитет провозглашён"
 mk_adl.3.d:0 "Айдов Матвей подписывает декларацию вечного нейтралитета."
 mk_adl.3.a:0 "Вперёд, без оглядки"
 mk_adl.3.b:0 "Тихая стабилизация"
 mk_adl.4.t:0 "Время силы"
 mk_adl.4.d:0 "Айдов Матвей распускает парламент. Гвардия занимает улицы."
 mk_adl.4.a:0 "Вперёд, без оглядки"
 mk_adl.4.b:0 "Вплести код НПТ в курс"
 mk_adl.5.t:0 "Народный поворот"
 mk_adl.5.d:0 "Айдов Матвей подписывает земельную реформу. Консерваторы в шоке."
 mk_adl.5.a:0 "Вперёд, без оглядки"
 mk_adl.5.b:0 "Экспорт лозунгов соседям"
 mk_adl.6.t:0 "Предложение арбитража"
 mk_adl.6.d:0 "Соседи просят Айдалию рассудить их спор. И следующий. И ещё один."
 mk_adl.6.a:0 "Открыть тайну миру"
 mk_adl.6.b:0 "Засекретить всё"
 mk_adl.7.t:0 "Посредник"
 mk_adl.7.d:0 "Айдалия примирила двух соседей — и получила благодарность Конгресса."
 mk_adl.7.a:0 "Выжать максимум"
 mk_adl.7.b:0 "Распределить выгоды"
 mk_adl.7.c:0 "Купить голос на Конгрессе"
 mk_adl.8.t:0 "Баланс утерян"
 mk_adl.8.d:0 "Соседи видят в Айдалии чужого союзника. Послы холодны."
 mk_adl.8.a:0 "Чрезвычайные меры"
 mk_adl.8.b:0 "Купить лояльность"
 mk_adl.8.c:0 "Свалить вину на соседей"
 mk_adl.9.t:0 "Все хотят Айдалию"
 mk_adl.9.d:0 "Каждый сосед предлагает союз. Отказать — значит обидеть всех."
 mk_adl.9.a:0 "Использовать подъём"
 mk_adl.9.b:0 "Сбросить напряжение"
 mk_adl.9.c:0 "Объявить исторический момент"
 mk_adl.10.t:0 "Финансовый центр"
 mk_adl.10.d:0 "Банки Айдалии хранят деньги половины Казуалии."
 mk_adl.10.a:0 "Новые заводы"
 mk_adl.10.b:0 "Инженерные бюро"
 mk_adl.10.c:0 "Военный заказ"
 mk_adl.11.t:0 "Неприступные горы"
 mk_adl.11.d:0 "Перевалы укреплены. Генералы соседей вычеркнули Айдалию из планов."
 mk_adl.11.a:0 "Подготовить повод к войне"
 mk_adl.11.b:0 "Только оборона"
 mk_adl.11.c:0 "Показательные манёвры"
 mk_adl.12.t:0 "Голос Конгресса"
 mk_adl.12.d:0 "Айдалия собрала больше всех подписей под своей резолюцией."
 mk_adl.12.a:0 "Голос на Конгрессе"
 mk_adl.12.b:0 "Друзья по всей Казуалии"
 mk_adl.12.c:0 "Сколотить идеологический блок"
 mk_adl.13.t:0 "Арбитр Казуалии"
 mk_adl.13.d:0 "Айдалия провозглашена главным арбитром Казуалии. Споры теперь решаются в её столице."
 mk_adl.13.a:0 "Баланс превыше всего"
 mk_adl.14.t:0 "Новый союзник"
 mk_adl.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_adl.14.a:0 "Укрепить договор"
 mk_adl.14.b:0 "Сразу требовать большего"
 mk_adl.15.t:0 "Слух из кабинетов"
 mk_adl.15.d:0 "В коридорах Айдалия шепчутся о новом курсе. Народ ждёт сигнала."
 mk_adl.15.a:0 "Разогнать слух"
 mk_adl.15.b:0 "Официально опровергнуть"
 mk_adl.15.c:0 "Подлить масла"
 mk_adl.16.t:0 "Повод на столе генштаба"
 mk_adl.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_adl.16.a:0 "Жёсткий ультиматум"
 mk_adl.16.b:0 "Тихая подготовка"
 mk_adl.16.c:0 "Отложить"
 mk_adl.17.t:0 "Тихий торг эпохи"
 mk_adl.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_adl.17.a:0 "Принять сделку"
 mk_adl.17.b:0 "Торговаться жёстче"
 mk_adl.17.c:0 "Отказаться"
 mk_adl.18.t:0 "Утечка из секретного архива"
 mk_adl.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_adl.18.a:0 "Засекретить обратно"
 mk_adl.18.b:0 "Опубликовать выборочно"
 mk_adl.18.c:0 "Обвинить соседей"
 mk_adl.19.t:0 "Идеологический саммит"
 mk_adl.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_adl.19.a:0 "Сколотить альянс сейчас"
 mk_adl.19.b:0 "Сначала мнения"
 mk_adl.19.c:0 "Только протокол"
