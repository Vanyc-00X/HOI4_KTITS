 mk_cat_FDP:0 "Парламентские мандаты"
 mk_cat_FDP_desc:0 "Федерацией правят лучшие из лучших — депутаты. Чем больше мандатов у правительства, тем быстрее принимаются решения.\n\n§YПарламентские мандаты:§! [?mk_mech|0] / 100"
 FDP_mech_up_tt:0 "Парламентские мандаты §Gрастёт§!"
 FDP_mech_down_tt:0 "Парламентские мандаты §Rснижается§!"
 FDP_dec_raise:0 "Перераспределить комитеты"
 FDP_dec_raise_desc:0 "Отдать союзным фракциям председательство в комитетах."
 FDP_dec_lower:0 "Независимые депутаты"
 FDP_dec_lower_desc:0 "Позволить депутатам голосовать по совести."
 FDP_dec_exploit:0 "Законодательный марафон"
 FDP_dec_exploit_desc:0 "Провести через Палату сразу весь пакет законов."
 FDP_dec_crisis:0 "Внеочередная сессия"
 FDP_dec_crisis_desc:0 "Созвать Палату ночью и не отпускать до голосования."
 FDP_dec_campaign_keep:0 "Кампания: Меритократия"
 FDP_dec_campaign_keep_desc:0 "Мобилизовать сторонников курса «Меритократия»."
 FDP_dec_campaign_a:0 "Кампания: Парламентская республика"
 FDP_dec_campaign_a_desc:0 "Мобилизовать сторонников курса «Парламентская республика»."
 FDP_dec_campaign_b:0 "Кампания: Диктатура лучших"
 FDP_dec_campaign_b_desc:0 "Мобилизовать сторонников курса «Диктатура лучших»."
 FDP_dec_campaign_c:0 "Кампания: Советы депутатов"
 FDP_dec_campaign_c_desc:0 "Мобилизовать сторонников курса «Советы депутатов»."
 mk_fdp.1.t:0 "Палата открыта"
 mk_fdp.1.d:0 "Багаутдинов Булат Рамилевич открывает сессию: «Мы — лучшие. Докажем это законами»."
 mk_fdp.1.a:0 "Ставка на «Парламентские мандаты»"
 mk_fdp.1.b:0 "Укрепить аппарат"
 mk_fdp.2.t:0 "Экзамен сдан"
 mk_fdp.2.d:0 "Багаутдинов лично принимает экзамен у нового кабинета. Сдали не все."
 mk_fdp.2.a:0 "Вперёд, без оглядки"
 mk_fdp.2.b:0 "Тихая стабилизация"
 mk_fdp.3.t:0 "Двери Палаты открыты"
 mk_fdp.3.d:0 "Багаутдинов отменяет экзамен для депутатов. Палата впервые заполнена до отказа."
 mk_fdp.3.a:0 "Вперёд, без оглядки"
 mk_fdp.3.b:0 "Международные наблюдатели"
 mk_fdp.4.t:0 "Палата распущена"
 mk_fdp.4.d:0 "Багаутдинов распускает Палату «до лучших времён». Лучшие времена — он сам."
 mk_fdp.4.a:0 "Вперёд, без оглядки"
 mk_fdp.4.b:0 "Вплести код НПТ в курс"
 mk_fdp.5.t:0 "Вся власть советам"
 mk_fdp.5.d:0 "Багаутдинов передаёт мандаты советам рабочих депутатов."
 mk_fdp.5.a:0 "Вперёд, без оглядки"
 mk_fdp.5.b:0 "Экспорт лозунгов соседям"
 mk_fdp.6.t:0 "Палата Казуалии"
 mk_fdp.6.d:0 "Депутаты предлагают пригласить в Палату представителей всех стран."
 mk_fdp.6.a:0 "Открыть тайну миру"
 mk_fdp.6.b:0 "Засекретить всё"
 mk_fdp.7.t:0 "Законодательный марафон"
 mk_fdp.7.d:0 "Палата приняла сорок законов за одну ночь."
 mk_fdp.7.a:0 "Выжать максимум"
 mk_fdp.7.b:0 "Распределить выгоды"
 mk_fdp.7.c:0 "Купить голос на Конгрессе"
 mk_fdp.8.t:0 "Палата бунтует"
 mk_fdp.8.d:0 "Депутаты блокируют бюджет. Опять."
 mk_fdp.8.a:0 "Чрезвычайные меры"
 mk_fdp.8.b:0 "Купить лояльность"
 mk_fdp.8.c:0 "Свалить вину на соседей"
 mk_fdp.9.t:0 "Палата без оппозиции"
 mk_fdp.9.d:0 "Оппозиции не осталось. Депутаты скучают и спорят друг с другом."
 mk_fdp.9.a:0 "Использовать подъём"
 mk_fdp.9.b:0 "Сбросить напряжение"
 mk_fdp.9.c:0 "Объявить исторический момент"
 mk_fdp.10.t:0 "Экономика достойных"
 mk_fdp.10.d:0 "Рейтинг министерств показал рекордный рост."
 mk_fdp.10.a:0 "Новые заводы"
 mk_fdp.10.b:0 "Инженерные бюро"
 mk_fdp.10.c:0 "Военный заказ"
 mk_fdp.11.t:0 "Армия лучших"
 mk_fdp.11.d:0 "Офицерский конкурс выиграли лучшие. Проигравшие ушли в генштаб."
 mk_fdp.11.a:0 "Подготовить повод к войне"
 mk_fdp.11.b:0 "Только оборона"
 mk_fdp.11.c:0 "Показательные манёвры"
 mk_fdp.12.t:0 "Межпарламентский союз"
 mk_fdp.12.d:0 "Соседние парламенты приглашают депутатов Федерации поделиться опытом."
 mk_fdp.12.a:0 "Голос на Конгрессе"
 mk_fdp.12.b:0 "Друзья по всей Казуалии"
 mk_fdp.12.c:0 "Сколотить идеологический блок"
 mk_fdp.13.t:0 "Вечная сессия"
 mk_fdp.13.d:0 "Федерация Депутатов объявила вечную сессию и пригласила в Палату всю Казуалию."
 mk_fdp.13.a:0 "Заседание продолжается"
 mk_fdp.14.t:0 "Новый союзник"
 mk_fdp.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_fdp.14.a:0 "Укрепить договор"
 mk_fdp.14.b:0 "Сразу требовать большего"
 mk_fdp.15.t:0 "Слух из кабинетов"
 mk_fdp.15.d:0 "В коридорах Федерация Депутатов шепчутся о новом курсе. Народ ждёт сигнала."
 mk_fdp.15.a:0 "Разогнать слух"
 mk_fdp.15.b:0 "Официально опровергнуть"
 mk_fdp.15.c:0 "Подлить масла"
 mk_fdp.16.t:0 "Повод на столе генштаба"
 mk_fdp.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_fdp.16.a:0 "Жёсткий ультиматум"
 mk_fdp.16.b:0 "Тихая подготовка"
 mk_fdp.16.c:0 "Отложить"
 mk_fdp.17.t:0 "Тихий торг эпохи"
 mk_fdp.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_fdp.17.a:0 "Принять сделку"
 mk_fdp.17.b:0 "Торговаться жёстче"
 mk_fdp.17.c:0 "Отказаться"
 mk_fdp.18.t:0 "Утечка из секретного архива"
 mk_fdp.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_fdp.18.a:0 "Засекретить обратно"
 mk_fdp.18.b:0 "Опубликовать выборочно"
 mk_fdp.18.c:0 "Обвинить соседей"
 mk_fdp.19.t:0 "Идеологический саммит"
 mk_fdp.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_fdp.19.a:0 "Сколотить альянс сейчас"
 mk_fdp.19.b:0 "Сначала мнения"
 mk_fdp.19.c:0 "Только протокол"
