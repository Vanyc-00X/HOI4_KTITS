 mk_cat_SOY:0 "Программистские проекты"
 mk_cat_SOY_desc:0 "Республика живёт стартапами. Чем больше проектов в работе, тем быстрее наука и торговля — и тем ближе НПТ.\n\n§YПрограммистские проекты:§! [?mk_mech|0] / 100"
