 mk_krz.1.t:0 "Пленум открыт"
 mk_krz.1.d:0 "Пименов Иоанн Павлович выходит на трибуну. Зал встаёт. Революция продолжается."
 mk_krz.1.a:0 "Ставка на «Революционный экспорт»"
 mk_krz.1.b:0 "Собрать советы на площадях"
 mk_krz.2.t:0 "Верность курсу"
 mk_krz.2.d:0 "Пименов клянётся: Красная Земля не свернёт с ленинского пути."
 mk_krz.2.a:0 "Вперёд, без оглядки"
 mk_krz.2.b:0 "Экспорт лозунгов соседям"
 mk_krz.3.t:0 "Нация превыше класса"
 mk_krz.3.d:0 "Пименов объявляет: революция — дело одной великой нации."
 mk_krz.3.a:0 "Вперёд, без оглядки"
 mk_krz.3.b:0 "Вплести код НПТ в курс"
 mk_krz.4.t:0 "Оттепель"
 mk_krz.4.d:0 "На улицах Красной Земли впервые продают газеты, которые ругают власть."
 mk_krz.4.a:0 "Вперёд, без оглядки"
 mk_krz.4.b:0 "Международные наблюдатели"
 mk_krz.5.t:0 "Директория у власти"
 mk_krz.5.d:0 "Пленум распущен, Директория заседает. Революция поставлена на паузу."
 mk_krz.5.a:0 "Вперёд, без оглядки"
 mk_krz.5.b:0 "Тихая стабилизация"
 mk_krz.6.t:0 "Час мировой революции"
 mk_krz.6.d:0 "Агитаторы докладывают: соседи готовы. Остаётся отдать приказ."
 mk_krz.6.a:0 "Открыть тайну миру"
 mk_krz.6.b:0 "Засекретить всё"
 mk_krz.7.t:0 "Революция у соседей"
 mk_krz.7.d:0 "Агитаторы Красной Земли докладывают об успехах за границей."
 mk_krz.7.a:0 "Выжать максимум"
 mk_krz.7.b:0 "Распределить выгоды"
 mk_krz.7.c:0 "Купить голос на Конгрессе"
 mk_krz.8.t:0 "Революция выдохлась"
 mk_krz.8.d:0 "Партийные собрания пустеют, агитаторы просятся домой."
 mk_krz.8.a:0 "Чрезвычайные меры"
 mk_krz.8.b:0 "Купить лояльность"
 mk_krz.8.c:0 "Свалить вину на соседей"
 mk_krz.9.t:0 "Революционный пожар"
 mk_krz.9.d:0 "Революционный дух захлёстывает страну. Соседи закрывают границы."
 mk_krz.9.a:0 "Использовать подъём"
 mk_krz.9.b:0 "Сбросить напряжение"
 mk_krz.9.c:0 "Объявить исторический момент"
 mk_krz.10.t:0 "Индустриальная держава"
 mk_krz.10.d:0 "Красная Земля перевыполнила план. Снова."
 mk_krz.10.a:0 "Новые заводы"
 mk_krz.10.b:0 "Инженерные бюро"
 mk_krz.10.c:0 "Военный заказ"
 mk_krz.11.t:0 "Армия революции"
 mk_krz.11.d:0 "Красная армия готова защищать революцию — и нести её дальше."
 mk_krz.11.a:0 "Подготовить повод к войне"
 mk_krz.11.b:0 "Только оборона"
 mk_krz.11.c:0 "Показательные манёвры"
 mk_krz.12.t:0 "Братские партии"
 mk_krz.12.d:0 "Делегации братских партий съезжаются в столицу Красной Земли."
 mk_krz.12.a:0 "Голос на Конгрессе"
 mk_krz.12.b:0 "Друзья по всей Казуалии"
 mk_krz.12.c:0 "Сколотить идеологический блок"
 mk_krz.13.t:0 "Мировая революция объявлена"
 mk_krz.13.d:0 "Красная Земля объявила начало мировой революции. Двадцать три правительства созывают экстренные советы."
 mk_krz.13.a:0 "История ускоряется"
 mk_krz.14.t:0 "Новый союзник"
 mk_krz.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_krz.14.a:0 "Укрепить договор"
 mk_krz.14.b:0 "Сразу требовать большего"
 mk_krz.15.t:0 "Слух из кабинетов"
 mk_krz.15.d:0 "В коридорах Красная Земля шепчутся о новом курсе. Народ ждёт сигнала."
 mk_krz.15.a:0 "Разогнать слух"
 mk_krz.15.b:0 "Официально опровергнуть"
 mk_krz.15.c:0 "Подлить масла"
 mk_krz.16.t:0 "Повод на столе генштаба"
 mk_krz.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_krz.16.a:0 "Жёсткий ультиматум"
 mk_krz.16.b:0 "Тихая подготовка"
 mk_krz.16.c:0 "Отложить"
 mk_krz.17.t:0 "Тихий торг эпохи"
 mk_krz.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_krz.17.a:0 "Принять сделку"
 mk_krz.17.b:0 "Торговаться жёстче"
 mk_krz.17.c:0 "Отказаться"
 mk_krz.18.t:0 "Утечка из секретного архива"
 mk_krz.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_krz.18.a:0 "Засекретить обратно"
 mk_krz.18.b:0 "Опубликовать выборочно"
 mk_krz.18.c:0 "Обвинить соседей"
 mk_krz.19.t:0 "Идеологический саммит"
 mk_krz.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_krz.19.a:0 "Сколотить альянс сейчас"
 mk_krz.19.b:0 "Сначала мнения"
 mk_krz.19.c:0 "Только протокол"
