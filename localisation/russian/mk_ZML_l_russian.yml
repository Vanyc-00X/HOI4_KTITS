 mk_cat_ZML:0 "Коммунальный торг"
 mk_cat_ZML_desc:0 "Общины Замалии постоянно торгуются с центром. Высокий консенсус даёт бонусы, раскол — штрафы.\n\n§YКоммунальный торг:§! [?mk_mech|0] / 100"
