 mk_isg.4.a:0 "Вперёд, без оглядки"
 mk_isg.4.b:0 "Тихая стабилизация"
 mk_isg.5.t:0 "Приказ кооперативам"
 mk_isg.5.d:0 "Исмагилов вводит обязательные нормы для всех кооперативов."
 mk_isg.5.a:0 "Вперёд, без оглядки"
 mk_isg.5.b:0 "Вплести код НПТ в курс"
 mk_isg.6.t:0 "Пай для соседей"
 mk_isg.6.d:0 "Исмагилов предлагает соседям вступить в кооперативную сеть."
 mk_isg.6.a:0 "Открыть тайну миру"
 mk_isg.6.b:0 "Засекретить всё"
 mk_isg.7.t:0 "Кооперативная сеть"
 mk_isg.7.d:0 "Кооперативы объединились в общенациональную сеть и построили новый завод."
 mk_isg.7.a:0 "Выжать максимум"
 mk_isg.7.b:0 "Распределить выгоды"
 mk_isg.7.c:0 "Купить голос на Конгрессе"
 mk_isg.8.t:0 "Кризис кооперативов"
 mk_isg.8.d:0 "Несколько крупных кооперативов разорились."
 mk_isg.8.a:0 "Чрезвычайные меры"
 mk_isg.8.b:0 "Купить лояльность"
 mk_isg.8.c:0 "Свалить вину на соседей"
 mk_isg.9.t:0 "Слишком устойчиво"
 mk_isg.9.d:0 "Кооперативы настолько осторожны, что не хотят ничего менять."
 mk_isg.9.a:0 "Использовать подъём"
 mk_isg.9.b:0 "Сбросить напряжение"
 mk_isg.9.c:0 "Объявить исторический момент"
 mk_isg.10.t:0 "Социальная экономика"
 mk_isg.10.d:0 "Кооперативы Исмагила дают работу всем."
 mk_isg.10.a:0 "Новые заводы"
 mk_isg.10.b:0 "Инженерные бюро"
 mk_isg.10.c:0 "Военный заказ"
 mk_isg.11.t:0 "Армия граждан"
 mk_isg.11.d:0 "Армия снабжается кооперативами — и снабжается хорошо."
 mk_isg.11.a:0 "Подготовить повод к войне"
 mk_isg.11.b:0 "Только оборона"
 mk_isg.11.c:0 "Показательные манёвры"
 mk_isg.12.t:0 "Социальный альянс"
 mk_isg.12.d:0 "Соседние кооперативы подписывают договоры с Исмагилом."
 mk_isg.12.a:0 "Голос на Конгрессе"
 mk_isg.12.b:0 "Друзья по всей Казуалии"
 mk_isg.12.c:0 "Сколотить идеологический блок"
 mk_isg.13.t:0 "Кооперативная Казуалия"
 mk_isg.13.d:0 "Республика Исмагил предложила всей Казуалии вступить в свою кооперативную сеть."
 mk_isg.13.a:0 "Все — пайщики!"
 mk_isg.14.t:0 "Новый союзник"
 mk_isg.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_isg.14.a:0 "Укрепить договор"
 mk_isg.14.b:0 "Сразу требовать большего"
 mk_isg.15.t:0 "Слух из кабинетов"
 mk_isg.15.d:0 "В коридорах Республика Исмагил шепчутся о новом курсе. Народ ждёт сигнала."
 mk_isg.15.a:0 "Разогнать слух"
 mk_isg.15.b:0 "Официально опровергнуть"
 mk_isg.15.c:0 "Подлить масла"
 mk_isg.16.t:0 "Повод на столе генштаба"
 mk_isg.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_isg.16.a:0 "Жёсткий ультиматум"
 mk_isg.16.b:0 "Тихая подготовка"
 mk_isg.16.c:0 "Отложить"
 mk_isg.17.t:0 "Тихий торг эпохи"
 mk_isg.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
