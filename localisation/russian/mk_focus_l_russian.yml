 mk_gen_industry:0 "Казуальная индустрия"
 mk_gen_industry_desc:0 "Заводы строятся быстрее, чем их успевают переименовать."
 mk_gen_mobilization:0 "Мобилизация на всякий случай"
 mk_gen_mobilization_desc:0 "Мы ни с кем не воюем. Пока."
 mk_gen_ideological_bloc:0 "Идеологический блок"
 mk_gen_ideological_bloc_desc:0 "Собрать единомышленников под одним знаменем."
 mk_gen_absurd_gambit:0 "Абсурдный гамбит"
