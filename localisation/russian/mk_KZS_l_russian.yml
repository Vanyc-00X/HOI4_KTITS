 mk_cat_KZS:0 "Сила Круга"
 mk_cat_KZS_desc:0 "Казачий Круг решает всё. Чем сильнее Круг, тем крепче оборона и тем смелее региональные решения.\n\n§YСила Круга:§! [?mk_mech|0] / 100"
