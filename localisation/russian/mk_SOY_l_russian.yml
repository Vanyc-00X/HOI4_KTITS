 SOY_dec_raise:0 "Запустить новый стартап"
 SOY_dec_raise_desc:0 "Ещё одно приложение, которое изменит мир. Или хотя бы Республику."
 SOY_dec_lower:0 "Рефакторинг"
 SOY_dec_lower_desc:0 "Закрыть лишние проекты и наконец написать документацию."
 SOY_dec_exploit:0 "Выход на IPO"
 SOY_dec_exploit_desc:0 "Продать долю в самых громких проектах и вложить деньги в государство."
 SOY_dec_crisis:0 "Хакатон спасения"
 SOY_dec_crisis_desc:0 "Собрать всех программистов страны на одни выходные."
