 mk_isl.1.t:0 "Слово Президента"
 mk_isl.1.d:0 "Габдрахманов Рэдик Флорович обращается к нации: «Мы сохраним веру и построим будущее»."
 mk_isl.1.a:0 "Ставка на «Индекс модернизации»"
 mk_isl.1.b:0 "Укрепить аппарат"
 mk_isl.2.t:0 "Путь сохранён"
 mk_isl.2.d:0 "Габдрахманов открывает новую мечеть и новый технопарк в один день."
 mk_isl.2.a:0 "Вперёд, без оглядки"
 mk_isl.2.b:0 "Тихая стабилизация"
 mk_isl.3.t:0 "Первые выборы"
 mk_isl.3.d:0 "На выборах побеждают партии, о которых год назад никто не слышал."
 mk_isl.3.a:0 "Вперёд, без оглядки"
 mk_isl.3.b:0 "Международные наблюдатели"
 mk_isl.4.t:0 "Жёсткая линия"
 mk_isl.4.d:0 "Габдрахманов передаёт полномочия Гвардии традиции. Реформы заморожены."
 mk_isl.4.a:0 "Вперёд, без оглядки"
 mk_isl.4.b:0 "Вплести код НПТ в курс"
 mk_isl.5.t:0 "Справедливость для всех"
 mk_isl.5.d:0 "Габдрахманов объявляет национализацию недр. Народ ликует."
 mk_isl.5.a:0 "Вперёд, без оглядки"
 mk_isl.5.b:0 "Экспорт лозунгов соседям"
 mk_isl.6.t:0 "Дом мудрости"
 mk_isl.6.d:0 "Учёные предлагают открыть новый Дом мудрости — для всей Казуалии."
 mk_isl.6.a:0 "Открыть тайну миру"
 mk_isl.6.b:0 "Засекретить всё"
 mk_isl.7.t:0 "Национальный проект"
 mk_isl.7.d:0 "Модернизация собрана в один национальный проект. Вся страна строит."
 mk_isl.7.a:0 "Выжать максимум"
 mk_isl.7.b:0 "Распределить выгоды"
 mk_isl.7.c:0 "Купить голос на Конгрессе"
 mk_isl.8.t:0 "Реформы встали"
 mk_isl.8.d:0 "Модернизация замерла. Молодёжь недовольна, старейшины — довольны."
 mk_isl.8.a:0 "Чрезвычайные меры"
 mk_isl.8.b:0 "Купить лояльность"
 mk_isl.8.c:0 "Свалить вину на соседей"
 mk_isl.9.t:0 "Слишком быстро"
 mk_isl.9.d:0 "Реформы идут так быстро, что консерваторы выходят на улицы."
 mk_isl.9.a:0 "Использовать подъём"
 mk_isl.9.b:0 "Сбросить напряжение"
 mk_isl.9.c:0 "Объявить исторический момент"
 mk_isl.10.t:0 "Процветание"
 mk_isl.10.d:0 "Караваны и заводы Республики приносят рекордные доходы."
 mk_isl.10.a:0 "Новые заводы"
 mk_isl.10.b:0 "Инженерные бюро"
 mk_isl.10.c:0 "Военный заказ"
 mk_isl.11.t:0 "Армия модернизации"
 mk_isl.11.d:0 "Армия Республики перевооружена. Соседи уважительно молчат."
 mk_isl.11.a:0 "Подготовить повод к войне"
 mk_isl.11.b:0 "Только оборона"
 mk_isl.11.c:0 "Показательные манёвры"
 mk_isl.12.t:0 "Посредник Казуалии"
 mk_isl.12.d:0 "Республику просят быть посредником в трёх спорах сразу."
 mk_isl.12.a:0 "Голос на Конгрессе"
 mk_isl.12.b:0 "Друзья по всей Казуалии"
 mk_isl.12.c:0 "Сколотить идеологический блок"
 mk_isl.13.t:0 "Золотой век Республики"
 mk_isl.13.d:0 "Исламская Республика открыла Дом мудрости. Учёные всей Казуалии едут туда работать."
 mk_isl.13.a:0 "Знание — свет"
 mk_isl.14.t:0 "Новый союзник"
 mk_isl.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_isl.14.a:0 "Укрепить договор"
 mk_isl.14.b:0 "Сразу требовать большего"
 mk_isl.15.t:0 "Слух из кабинетов"
 mk_isl.15.d:0 "В коридорах Исламская Республика шепчутся о новом курсе. Народ ждёт сигнала."
 mk_isl.15.a:0 "Разогнать слух"
 mk_isl.15.b:0 "Официально опровергнуть"
 mk_isl.15.c:0 "Подлить масла"
 mk_isl.16.t:0 "Повод на столе генштаба"
 mk_isl.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_isl.16.a:0 "Жёсткий ультиматум"
 mk_isl.16.b:0 "Тихая подготовка"
 mk_isl.16.c:0 "Отложить"
 mk_isl.17.t:0 "Тихий торг эпохи"
 mk_isl.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_isl.17.a:0 "Принять сделку"
 mk_isl.17.b:0 "Торговаться жёстче"
 mk_isl.17.c:0 "Отказаться"
 mk_isl.18.t:0 "Утечка из секретного архива"
 mk_isl.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_isl.18.a:0 "Засекретить обратно"
 mk_isl.18.b:0 "Опубликовать выборочно"
 mk_isl.18.c:0 "Обвинить соседей"
 mk_isl.19.t:0 "Идеологический саммит"
 mk_isl.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_isl.19.a:0 "Сколотить альянс сейчас"
 mk_isl.19.b:0 "Сначала мнения"
 mk_isl.19.c:0 "Только протокол"
