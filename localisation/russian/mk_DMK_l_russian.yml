 DMK_absurd_23_desc:0 "Сидоров расширяет княжескую унию печатями, гарантиями и трактами, за которыми всегда стоит историческое право."
 mk_cat_DMK:0 "Очки интеграции"
 mk_cat_DMK_desc:0 "Дмитро-Княжество собирает земли не войной, а интеграцией. Накопленные очки позволяют мирно присоединять территории соседей.\n\n§YОчки интеграции:§! [?mk_mech|0] / 100"
 DMK_mech_up_tt:0 "Очки интеграции §Gрастёт§!"
 DMK_mech_down_tt:0 "Очки интеграции §Rснижается§!"
 DMK_dec_raise:0 "Интеграционная программа"
 DMK_dec_raise_desc:0 "Строить дороги к границам и раздавать паспорта соседям."
 DMK_dec_lower:0 "Уступки боярам"
 DMK_dec_lower_desc:0 "Отдать удельным боярам часть власти."
 DMK_dec_exploit:0 "Мирная интеграция"
 DMK_dec_exploit_desc:0 "Присоединить пограничную область соседа без единого выстрела."
 DMK_dec_crisis:0 "Княжеский съезд"
 DMK_dec_crisis_desc:0 "Собрать бояр и напомнить им, кто князь."
 DMK_dec_campaign_keep:0 "Кампания: Интегрализм"
 DMK_dec_campaign_keep_desc:0 "Мобилизовать сторонников курса «Интегрализм»."
 DMK_dec_campaign_a:0 "Кампания: Княжеская уния"
 DMK_dec_campaign_a_desc:0 "Мобилизовать сторонников курса «Княжеская уния»."
 DMK_dec_campaign_b:0 "Кампания: Федерация княжеств"
 DMK_dec_campaign_b_desc:0 "Мобилизовать сторонников курса «Федерация княжеств»."
 DMK_dec_campaign_c:0 "Кампания: Народное княжество"
 DMK_dec_campaign_c_desc:0 "Мобилизовать сторонников курса «Народное княжество»."
 mk_dmk.1.t:0 "Князь собирает земли"
 mk_dmk.1.d:0 "Сидоров Дмитрий Рустамович объявляет курс интегрализма. Карту на стене уже перекрашивают."
 mk_dmk.1.a:0 "Ставка на «Очки интеграции»"
 mk_dmk.1.b:0 "Тихо подключить ячейки НПТ"
 mk_dmk.2.t:0 "Курс интеграции"
 mk_dmk.2.d:0 "Сидоров объявляет: «Мы соберём все земли — добрым словом»."
 mk_dmk.2.a:0 "Вперёд, без оглядки"
 mk_dmk.2.b:0 "Вплести код НПТ в курс"
 mk_dmk.3.t:0 "Предложение унии"
 mk_dmk.3.d:0 "Сидоров отправляет соседям грамоты об унии. Некоторые читают внимательно."
 mk_dmk.3.a:0 "Вперёд, без оглядки"
 mk_dmk.3.b:0 "Тихая стабилизация"
 mk_dmk.4.t:0 "Вече собрано"
 mk_dmk.4.d:0 "Сидоров созывает вече всех земель. Голосование идёт три дня."
 mk_dmk.4.a:0 "Вперёд, без оглядки"
 mk_dmk.4.b:0 "Международные наблюдатели"
 mk_dmk.5.t:0 "Бояре свергнуты"
 mk_dmk.5.d:0 "Сидоров подписывает декрет о земле. Бояре бегут к соседям."
 mk_dmk.5.a:0 "Вперёд, без оглядки"
 mk_dmk.5.b:0 "Экспорт лозунгов соседям"
 mk_dmk.6.t:0 "Венчание на великое княжение"
 mk_dmk.6.d:0 "Сидоров принимает титул Великого Князя Казуалии."
 mk_dmk.6.a:0 "Открыть тайну миру"
 mk_dmk.6.b:0 "Засекретить всё"
 mk_dmk.7.t:0 "Мирная интеграция"
 mk_dmk.7.d:0 "Пограничная область соседа проголосовала за присоединение. Единогласно."
 mk_dmk.7.a:0 "Выжать максимум"
 mk_dmk.7.b:0 "Распределить выгоды"
 mk_dmk.7.c:0 "Купить голос на Конгрессе"
 mk_dmk.8.t:0 "Бояре своевольничают"
 mk_dmk.8.d:0 "Удельные бояре игнорируют указы князя."
 mk_dmk.8.a:0 "Чрезвычайные меры"
 mk_dmk.8.b:0 "Купить лояльность"
 mk_dmk.8.c:0 "Свалить вину на соседей"
 mk_dmk.9.t:0 "Соседи тревожатся"
 mk_dmk.9.d:0 "Интеграция идёт так быстро, что соседи созывают совещание о Княжестве."
 mk_dmk.9.a:0 "Использовать подъём"
 mk_dmk.9.b:0 "Сбросить напряжение"
 mk_dmk.9.c:0 "Объявить исторический момент"
 mk_dmk.10.t:0 "Богатство Княжества"
 mk_dmk.10.d:0 "Новые земли приносят доход в казну князя."
 mk_dmk.10.a:0 "Новые заводы"
 mk_dmk.10.b:0 "Инженерные бюро"
 mk_dmk.10.c:0 "Военный заказ"
 mk_dmk.11.t:0 "Великая дружина"
 mk_dmk.11.d:0 "Дружина Княжества марширует вдоль границ. Просто так, для вида."
 mk_dmk.11.a:0 "Подготовить повод к войне"
 mk_dmk.11.b:0 "Только оборона"
 mk_dmk.11.c:0 "Показательные манёвры"
 mk_dmk.12.t:0 "Княжество на Конгрессе"
 mk_dmk.12.d:0 "Послы князя привезли на Конгресс подарки и проекты договоров."
 mk_dmk.12.a:0 "Голос на Конгрессе"
 mk_dmk.12.b:0 "Друзья по всей Казуалии"
 mk_dmk.12.c:0 "Сколотить идеологический блок"
 mk_dmk.13.t:0 "Великое Княжество"
 mk_dmk.13.d:0 "Дмитро-Княжество провозгласило себя Великим. Соседи проверяют свои границы."
 mk_dmk.13.a:0 "Все земли — едины"
 mk_dmk.14.t:0 "Новый союзник"
 mk_dmk.14.d:0 "В блок вступила держава с близкой идеологией. Карта альянсов Казуалии дрогнула."
 mk_dmk.14.a:0 "Укрепить договор"
 mk_dmk.14.b:0 "Сразу требовать большего"
 mk_dmk.15.t:0 "Слух из кабинетов"
 mk_dmk.15.d:0 "В коридорах Дмитро-Княжество шепчутся о новом курсе. Народ ждёт сигнала."
 mk_dmk.15.a:0 "Разогнать слух"
 mk_dmk.15.b:0 "Официально опровергнуть"
 mk_dmk.15.c:0 "Подлить масла"
 mk_dmk.16.t:0 "Повод на столе генштаба"
 mk_dmk.16.d:0 "Офицеры принесли три версии одного и того же повода к войне. Выберите тон."
 mk_dmk.16.a:0 "Жёсткий ультиматум"
 mk_dmk.16.b:0 "Тихая подготовка"
 mk_dmk.16.c:0 "Отложить"
 mk_dmk.17.t:0 "Тихий торг эпохи"
 mk_dmk.17.d:0 "Нейтральные кулуары предлагают сделку: стабильность взамен на голос и сырьё."
 mk_dmk.17.a:0 "Принять сделку"
 mk_dmk.17.b:0 "Торговаться жёстче"
 mk_dmk.17.c:0 "Отказаться"
 mk_dmk.18.t:0 "Утечка из секретного архива"
 mk_dmk.18.d:0 "Кто-то вынес папку с грифом. Теперь все делают вид, что не читали."
 mk_dmk.18.a:0 "Засекретить обратно"
 mk_dmk.18.b:0 "Опубликовать выборочно"
 mk_dmk.18.c:0 "Обвинить соседей"
 mk_dmk.19.t:0 "Идеологический саммит"
 mk_dmk.19.d:0 "За одним столом — все, кто разделяет ваш курс. Кто-то уже готов к блоку."
 mk_dmk.19.a:0 "Сколотить альянс сейчас"
 mk_dmk.19.b:0 "Сначала мнения"
 mk_dmk.19.c:0 "Только протокол"
